<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Card Max">
<meta name="theme-color" content="#0f172a">
<title>Card Maximizer</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:#0f172a;color:#e2e8f0;font-family:'DM Sans','Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
input::placeholder{color:#64748b}
input:focus{outline:none}
button{font-family:inherit}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes altSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes drawerUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mono{font-family:'JetBrains Mono',monospace}
.hidden{display:none!important}

.header{background:#0f172a;padding:16px 16px 0;padding-top:max(16px,env(safe-area-inset-top));position:sticky;top:0;z-index:100;border-bottom:1px solid #1e293b}
.tabs{display:flex;background:#1e293b;border-radius:10px;padding:3px}
.tab{flex:1;text-align:center;padding:10px 4px;border-radius:8px;cursor:pointer;user-select:none;font-size:13px;font-weight:600;color:#64748b;transition:background .12s}
.tab.active{background:#334155;color:#fff}

.banner{margin:12px 10px 0;padding:11px 14px;border-radius:12px;background:#422006;border:1px solid #a16207;color:#fde68a;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.banner span{margin-left:auto;color:#fbbf24}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 10px 40px}
.tile{background:#1e293b;border-radius:14px;padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;min-height:90px;border:1px solid #1e293b}
.tile:active{background:#334155}

.overlay{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 24px 110px;animation:fadeIn .12s ease;overflow-y:auto}
.back-btn{position:fixed;bottom:max(32px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(255,255,255,.12);color:#e2e8f0;font-size:15px;font-weight:600;padding:12px 36px;border-radius:12px;cursor:pointer;user-select:none;border:1px solid rgba(255,255,255,.15);white-space:nowrap}
.back-btn:active{background:rgba(255,255,255,.2)}
.hchip{font-size:12px;color:#cbd5e1;background:rgba(255,255,255,.08);padding:5px 10px;border-radius:8px;margin:4px 3px 0}
.hchip.warn{background:rgba(251,191,36,.15);color:#fde68a}
.hchip.apr{background:rgba(56,189,248,.15);color:#bae6fd}

.sheet-bg{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .12s ease}
.sheet{background:#1e293b;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:20px 20px max(28px,env(safe-area-inset-bottom));animation:drawerUp .2s ease}
.handle{width:36px;height:4px;border-radius:2px;background:#475569;margin:0 auto 16px}
.sec{font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin:20px 0 8px}
.box{background:#0f172a;border-radius:10px;padding:10px 12px;margin-bottom:4px}
.stat{flex:1;background:#0f172a;border-radius:10px;padding:8px 6px;text-align:center;border:1px solid transparent}
.stat .l{font-size:10px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:13px;font-weight:700;color:#e2e8f0;margin-top:2px}

.chip{display:inline-flex;align-items:center;padding:7px 12px;border-radius:999px;background:#0f172a;border:1px solid #334155;color:#cbd5e1;font-size:13px;font-weight:600;margin:0 6px 6px 0;cursor:pointer;user-select:none}
.chip.on{background:#132216;border-color:#16a34a;color:#4ade80}
.btn{display:block;width:100%;text-align:center;background:#16a34a;color:#fff;font-size:15px;font-weight:700;padding:13px;border-radius:12px;border:none;cursor:pointer}
.btn:disabled{background:#334155;color:#64748b}
.btn-ghost{display:block;width:100%;text-align:center;background:rgba(255,255,255,.08);color:#94a3b8;font-size:14px;font-weight:600;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.1);cursor:pointer;margin-top:10px}
.btn-sm{background:#16a34a;color:#fff;border:none;font-size:12px;font-weight:700;padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn-sm.alt{background:#334155;color:#e2e8f0}
.btn-danger{display:block;width:100%;text-align:center;background:transparent;color:#f87171;font-size:14px;font-weight:600;padding:12px;border:none;cursor:pointer;margin-top:6px}

.search-input,.field{width:100%;padding:10px 14px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:15px;font-family:inherit}
.field{background:#0f172a}
.search-input:focus,.field:focus{border-color:#059669}
.flabel{font-size:12px;color:#94a3b8;font-weight:600;margin:12px 0 6px}
.add-btn{flex-shrink:0;background:#16a34a;color:#fff;font-weight:700;font-size:14px;padding:0 14px;border-radius:10px;display:flex;align-items:center;cursor:pointer;user-select:none}

.card-row{background:#1e293b;border-radius:14px;padding:14px 16px;margin-bottom:6px;cursor:pointer;user-select:none;border:1px solid #334155;display:flex;align-items:center;gap:12px}
.card-row:active{background:#334155}
.group{font-size:12px;font-weight:700;display:inline-block;padding:3px 10px;border-radius:6px;margin-bottom:8px;letter-spacing:.04em}
.dot{width:8px;height:8px;border-radius:50%;background:#fbbf24;display:inline-block;margin-left:6px;vertical-align:middle}
.prod-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:#0f172a;margin-bottom:5px;cursor:pointer}
.prod-row:active{background:#334155}
.task{background:#0f172a;border-radius:12px;padding:12px;margin-bottom:6px}
.art{position:relative;width:100%;aspect-ratio:1.586;border-radius:14px;overflow:hidden;color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.12)}
.art.mini{border-radius:5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);flex-shrink:0}
.art-band{position:absolute;inset:0;background:radial-gradient(circle at 85% 18%,rgba(255,255,255,.22),transparent 42%),linear-gradient(120deg,transparent 52%,rgba(255,255,255,.1) 52%,rgba(255,255,255,.1) 70%,transparent 70%)}
.art-iss{position:absolute;top:9%;left:7%;font-weight:700;font-size:15px;letter-spacing:.02em}
.art-chip{position:absolute;left:7%;top:38%;width:15%;aspect-ratio:1.3;border-radius:18%;background:linear-gradient(135deg,#fde68a,#d4a017 55%,#fcd34d)}
.art.mini .art-chip{top:30%;left:10%;width:26%}
.art-name{position:absolute;left:7%;bottom:9%;font-size:15px;font-weight:600;right:30%;line-height:1.15}
.art-net{position:absolute;right:7%;bottom:9%;font-size:13px;font-weight:700;letter-spacing:.04em;opacity:.9}
.add-title{font-size:20px;font-weight:700;color:#f1f5f9}
.add-sub{font-size:13px;color:#94a3b8;margin:2px 0 14px}
.add-search{display:flex;align-items:center;gap:8px;background:#0f172a;border:1px solid #334155;border-radius:12px;padding:0 12px}
.add-search:focus-within{border-color:#059669}
.add-search input{flex:1;background:transparent;border:none;color:#e2e8f0;font-size:16px;padding:12px 0;font-family:inherit;min-width:0}
.bank-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.bank-tile{background:#0f172a;border:1px solid #334155;border-radius:14px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;cursor:pointer;text-align:center;user-select:none}
.bank-tile:active{background:#334155}
.mono-logo{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;letter-spacing:-.02em;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);flex-shrink:0}
.bank-name{font-size:13px;font-weight:700;color:#f1f5f9;margin-top:8px;line-height:1.2}
.bank-count{font-size:11px;color:#64748b;margin-top:2px}
.add-sec{font-size:13px;font-weight:700;color:#94a3b8;margin:18px 0 4px}
.add-back{font-size:15px;color:#4ade80;font-weight:600;cursor:pointer;display:inline-block;padding:4px 0;user-select:none}
.offer{background:#0f172a;border:1px solid #334155;border-radius:18px;padding:18px;margin-bottom:12px}
.offer-art{max-width:280px;margin:4px auto 18px}
.offer-name{font-size:18px;font-weight:700;color:#f1f5f9;margin-bottom:10px}
.offer-row{font-size:14px;color:#cbd5e1;margin-bottom:6px}
.offer-row b{color:#f1f5f9}
.offer-hl{background:#132216;border-radius:10px;padding:10px 12px;margin:12px 0;font-size:13px;color:#bbf7d0;line-height:1.7}
.owned{font-size:13px;color:#4ade80;font-weight:600;margin-bottom:10px}
.offer-src{font-size:11px;color:#64748b;margin-bottom:12px}
.compact{display:flex;align-items:center;gap:12px;background:#0f172a;border:1px solid #334155;border-radius:14px;padding:10px 12px;margin-top:6px;cursor:pointer}
.empty{text-align:center;padding:28px;color:#64748b;font-size:13px}
.fab{position:fixed;right:20px;bottom:max(24px,calc(env(safe-area-inset-bottom) + 12px));width:60px;height:60px;border-radius:50%;background:#16a34a;color:#fff;font-size:34px;font-weight:400;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(22,163,74,.45),0 2px 6px rgba(0,0,0,.4);cursor:pointer;user-select:none;z-index:150;border:none;padding-bottom:3px}
.fab:active{transform:scale(.94);background:#15803d}
.tag{display:inline-block;font-size:11px;font-weight:600;color:#fde68a;background:rgba(251,191,36,.15);padding:2px 8px;border-radius:6px;margin-top:4px}
.btn:disabled{opacity:.7;cursor:default}
.foot{text-align:center;padding:4px 16px 28px;font-size:11px;color:#475569;line-height:1.6}
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
    <div style="width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#16a34a,#059669);display:flex;align-items:center;justify-content:center;font-size:17px">💳</div>
    <div style="flex:1">
      <div style="font-size:16px;font-weight:700;letter-spacing:-0.02em">Card Maximizer</div>
      <div id="subtitle" style="font-size:11px;color:#475569;font-weight:500"></div>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" id="tab-quick" onclick="switchTab('quick')">📋 Categories</div>
    <div class="tab" id="tab-cards" onclick="switchTab('cards')">💳 Wallet</div>
    <div class="tab hidden-tab" id="tab-full" onclick="switchTab('full')">📋 List</div>
  </div>
</div>

<div id="quick-view">
  <div id="quick-banner"></div>
  <div style="padding:12px 14px 0"><input id="quick-q" class="search-input" type="search" placeholder="Search: restaurant, Costco, Uber…" autocomplete="off" oninput="quickQ=this.value;renderGrid()"></div>
  <div id="grid" class="grid"></div>
</div>

<div id="cards-view" class="hidden">
  <div id="cards-banner"></div>
  <div style="padding:12px 14px 6px;display:flex;gap:8px">
    <input id="cards-q" class="search-input" type="text" placeholder="Search your wallet" oninput="cardsQ=this.value;renderCardsList()">
  </div>
  <div id="cards-list" style="padding:8px 12px 12px"></div>
  <div id="catalog-foot" class="foot" style="padding-bottom:100px"></div>
  <button class="fab" onclick="openAdd()" aria-label="Add a card">+</button>
</div>

<div id="full-view" class="hidden">
  <div style="padding:12px 14px 6px">
    <input id="full-q" class="search-input" type="text" placeholder="Search category or card" oninput="fullQ=this.value;expandedId=null;renderFullList()">
  </div>
  <div id="full-list" style="padding:4px 12px 40px"></div>
</div>

<div id="overlay" class="overlay hidden"></div>
<div id="sheet" class="hidden"></div>

<script>
/* v1.0 feature switches: hidden features stay in the code, turn back on here */
const SHOW={accountDetails:false /* due date, limit, fee, rewards balance */, categoriesTab:false /* list view of categories */};
const SINGLE_CARD_PER_PRODUCT=true; // wallet holds at most one of each card

/* ══════════════════════════════════════════════════════════
   1. SPENDING CATEGORIES (the tiles you tap at checkout)
   parent:   also earns the parent's rate (fast food counts as dining)
   networks: only these networks are accepted (Costco = Visa only)
   niche:    tile only shows when one of your cards earns extra there
   ══════════════════════════════════════════════════════════ */

  {id:"pets",label:"Pet Supplies",emoji:"🐾",niche:true,kw:"pet petco petsmart"},
  {id:"beauty",label:"Salon & Beauty",emoji:"💇",niche:true,kw:"salon barber beauty ulta sephora cosmetics"},
  {id:"office",label:"Office Supplies",emoji:"📎",niche:true,kw:"office supplies staples office depot"},
  {id:"other",label:"Other",emoji:"🔄",kw:"other everything else"},
];

/* ══════════════════════════════════════════════════════════
   2. CARD CATALOG (public product data, same for every user)
   The embedded copy is catalog.json at build time. When CATALOG_URL
   is set, the app checks it on open and keeps whichever is newer.
   ══════════════════════════════════════════════════════════ */

const KEY="cardmax-v3", CAT_KEY="cardmax-catalog";
let memStore={};
const store={
  get(k){try{return localStorage.getItem(k)}catch{return memStore[k]??null}},
  set(k,v){try{localStorage.setItem(k,v)}catch{memStore[k]=v}}
};
let CATALOG=EMBEDDED_CATALOG;
try{const c=JSON.parse(store.get(CAT_KEY));if(c&&c.products&&c.version>CATALOG.version)CATALOG=c}catch{}
const P=id=>CATALOG.products[id];
const B=key=>CATALOG.brands[key]||{name:key,short:key,mono:String(key).slice(0,2).toUpperCase(),colors:["#475569","#1e293b"]};

function normalize(w){
  if(ALIASES[w.product]){if(w.product==="ally_everyday"&&!w.nickname)w.nickname="Ally";w.product=ALIASES[w.product]}
  w.sel=w.sel||{};
  Object.values(w.sel).forEach(s=>{if(s&&!s.opts&&s.cats){s.opts=s.cats;delete s.cats}});
  w.activated=w.activated||[];w.promos=w.promos||[];w.nickname=w.nickname||"";w.last4=w.last4||"";w.rewards=w.rewards??"";w.limit=w.limit||"";
  return w;
}
function load(){
  try{const s=JSON.parse(store.get(KEY));if(s&&s.wallet){s.wallet.forEach(normalize);return s}}catch{}
  const s=JSON.parse(JSON.stringify(SEED));
  try{const old=JSON.parse(store.get("cardmax-rewards")||"{}");s.wallet.forEach(w=>{if(old[w.id]!==undefined)w.rewards=old[w.id]})}catch{}
  s.wallet.forEach(normalize);
  store.set(KEY,JSON.stringify(s));
  return s;
}
let state=load();
const save=()=>store.set(KEY,JSON.stringify(state));

async function syncCatalog(){
  if(!CATALOG_URL)return;
  try{
    const r=await fetch(CATALOG_URL,{cache:"no-store"});const data=await r.json();
    if(data&&data.products&&data.version>CATALOG.version){CATALOG=data;store.set(CAT_KEY,JSON.stringify(data));refreshAll()}
  }catch{}
}

/* ══════════════════════════════════════════════════════════

const NOW=new Date();
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const TODAY=iso(NOW);
const qKey=d=>d.getFullYear()+"-Q"+(Math.floor(d.getMonth()/3)+1);
const QK=qKey(NOW);
const NQK=(()=>{const q=Math.floor(NOW.getMonth()/3)+1;return q===4?(NOW.getFullYear()+1)+"-Q1":NOW.getFullYear()+"-Q"+(q+1)})();
const qLabel=k=>{const[y,q]=k.split("-");return q+" "+y};
const qEnd=k=>{const[y,q]=k.split("-Q").map(Number);return new Date(y,q*3,0)};
const qStart=k=>{const[y,q]=k.split("-Q").map(Number);return new Date(y,(q-1)*3,1)};
const qDeadline=(k,day)=>{const[y,q]=k.split("-Q").map(Number);return new Date(y,q*3-1,day)};
const daysLeftInQ=Math.round((qEnd(QK)-new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()))/864e5);
const PICK_Q=daysLeftInQ<=15?NQK:QK; // near quarter end, quarterly picks are for next quarter
const shortDate=d=>d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
const isoToDate=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const ordinal=n=>{if(!n)return"—";const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const catById=id=>CATS.find(c=>c.id===id);
const catName=id=>catById(id)?.label||id;
const fmtRate=r=>Number.isInteger(r)?String(r):String(+r.toFixed(2));
const walletById=id=>state.wallet.find(w=>w.id===id);
const dn=w=>w.nickname||P(w.product)?.short||"Card";
const unitOf=p=>p&&p.type!=="cash"?"x":"%";
const capWord=w=>w?w[0].toUpperCase()+w.slice(1):"";
const netLabel=n=>n==="store"?"Store card":capWord(n);
const netOf=w=>w.network||P(w.product)?.network;

function pctColor(p){return p>=5?"#16a34a":p>=4?"#059669":p>=3?"#0284c7":p>=2?"#6366f1":"#94a3b8"}
function pctBg(p){return p>=5?"#dcfce7":p>=4?"#d1fae5":p>=3?"#dbeafe":p>=2?"#e0e7ff":"#f1f5f9"}
function grad(p){return p>=5?"linear-gradient(145deg,#14532d,#052e16)":p>=3?"linear-gradient(145deg,#0c4a6e,#082f49)":"linear-gradient(145deg,#1e293b,#0f172a)"}
function accent(p){return p>=5?"#4ade80":p>=3?"#38bdf8":"#94a3b8"}

const PCOL=[["#fef3c7","#92400e"],["#ede9fe","#5b21b6"],["#cffafe","#155e75"],["#fce7f3","#9d174d"]];
function personColors(id){const i=state.people.findIndex(p=>p.id===id);return i<0?null:PCOL[i%PCOL.length]}
function badge(owner,size){
  const i=state.people.findIndex(p=>p.id===owner);if(i<0)return"";
  const[bg,fg]=PCOL[i%PCOL.length];const ini=esc(state.people[i].name[0].toUpperCase());
  return size==="lg"
    ?`<span style="font-size:13px;font-weight:700;background:${bg};color:${fg};padding:2px 8px;border-radius:6px">${ini}</span>`
    :`<span style="font-size:9px;font-weight:700;background:${bg};color:${fg};padding:1px 5px;border-radius:4px">${ini}</span>`;
}

/* choice-slot helpers: options are {id,label,cats} */
const optOf=(slot,id)=>(slot.options||[]).find(o=>o.id===id);
const selOpts=(w,slot)=>{const s=w.sel[slot.id];return s&&s.opts&&s.opts.length?s.opts:(slot.default?[slot.default]:[])};
const isDefaultSel=(w,slot)=>!(w.sel[slot.id]&&w.sel[slot.id].opts&&w.sel[slot.id].opts.length)&&!!slot.default;
const selCats=(w,slot)=>selOpts(w,slot).flatMap(id=>optOf(slot,id)?.cats||[]);
const selLabels=(w,slot)=>selOpts(w,slot).map(id=>optOf(slot,id)?.label||id);

/* ══════════════════════════════════════════════════════════
   6. RANKING ENGINE
   ══════════════════════════════════════════════════════════ */
function matches(cats,excl,cat){
  if(cats.includes(cat.id))return true;
  return !!(cat.parent&&cats.includes(cat.parent)&&!(excl||[]).includes(cat.id));
}
function evalCard(w,cat){
  const p=P(w.product);if(!p)return null;
  if(p.storeOnly&&!p.storeOnly.includes(cat.id))return null;
  if(cat.networks&&!cat.networks.includes(netOf(w)))return null;
  const bx=p.baseExcept&&p.baseExcept.cats.includes(cat.id)?p.baseExcept:null;
  let best={rate:bx?bx.rate:p.base,label:bx?bx.label:(p.baseLabel||"Everything else"),note:"",flags:[]};
  const take=(rate,label,note,flags)=>{if(rate>best.rate)best={rate,label,note:note||"",flags:flags||[]}};
  const conds=[];
  (p.rules||[]).forEach(r=>{if(!matches(r.cats,r.excl,cat))return;if(r.cond)conds.push(r);else take(r.rate,r.label,r.note)});
  (p.choice||[]).forEach(slot=>{
    if(!matches(selCats(w,slot),null,cat))return;
    const s=w.sel[slot.id];
    const stale=slot.period==="quarter"&&(!s||!s.quarter||s.quarter<QK);
    take(slot.rate,slot.label.replace("Your ","").replace(/^./,c=>c.toUpperCase()),slot.note,stale?["confirm"]:[]);
  });
  if(p.rotating){
    const q=p.rotating.schedule[QK];
    if(q&&matches(q.cats,null,cat)){
      if(w.activated.includes(QK))take(p.rotating.rate,qLabel(QK)+" bonus",p.rotating.cap);
      else if(p.rotating.retroactive&&qDeadline(QK,p.rotating.deadlineDay||31)>=NOW)
        take(p.rotating.rate,qLabel(QK)+" bonus",`Activate by ${shortDate(qDeadline(QK,p.rotating.deadlineDay))}`,["activate"]);
    }
  }
  if(p.auto&&w.autoFocus&&matches([w.autoFocus],null,cat))take(p.auto.rate,"Top category this cycle",p.auto.note);
  let rate=best.rate;const extras=[];
  w.promos.forEach(pr=>{if(pr.until>=TODAY){rate+=pr.extra;extras.push(pr)}});
  const mult=p.type==="cash"?1:(p.cpp||1),bump=extras.reduce((a,e)=>a+e.extra,0);
  rate=rate*mult;
  const special=conds.map(r=>({rate:Math.round((r.rate+bump)*mult*100)/100,label:r.label,cond:r.cond}))
    .filter(x=>x.rate>rate).sort((a,b)=>b.rate-a.rate)[0]||null;
  const apr=w.introApr&&w.introApr>=TODAY?w.introApr:null;
  return {w,p,rate:Math.round(rate*100)/100,label:best.label,note:best.note,flags:best.flags,extras,apr,special};
}
function rank(cat){
  return state.wallet.map(w=>evalCard(w,cat)).filter(Boolean)
    .sort((a,b)=>b.rate-a.rate||a.flags.length-b.flags.length);
}
function networkHidden(cat){
  if(!cat.networks)return 0;
  return state.wallet.filter(w=>{const p=P(w.product);return p&&!p.storeOnly&&!cat.networks.includes(netOf(w))}).length;
}
/* does any wallet card name this category directly (not via parent)? */
function directHit(cat){
  return state.wallet.some(w=>{
    const p=P(w.product);if(!p)return false;
    if((p.rules||[]).some(r=>r.cats.includes(cat.id)))return true;
    if((p.choice||[]).some(s=>selCats(w,s).includes(cat.id)))return true;
    const q=p.rotating&&p.rotating.schedule[QK];if(q&&q.cats.includes(cat.id))return true;
    return p.auto&&w.autoFocus===cat.id;
  });
}
const visibleCats=()=>CATS.filter(c=>!c.niche||directHit(c));

/* ══════════════════════════════════════════════════════════
   7. TASKS (quarterly activation & picks)
   ══════════════════════════════════════════════════════════ */
function tasksFor(w){
  const p=P(w.product);if(!p)return[];const t=[];
  if(p.rotating){
    const r=p.rotating;
    [QK,NQK].forEach(k=>{
      const q=r.schedule[k];if(!q||w.activated.includes(k))return;
      if(k===NQK&&(!q.opens||q.opens>TODAY))return;
      if(k===QK){
        if(r.retroactive){if(qDeadline(k,r.deadlineDay||31)<NOW)return}
        else if(daysLeftInQ<=2)return;
      }
      const due=r.retroactive?`Activate by ${shortDate(qDeadline(k,r.deadlineDay||31))}`:(k===QK?`Ends ${shortDate(qEnd(k))}`:`Starts ${shortDate(qStart(k))}, activate before you spend`);
      t.push({kind:"activate",q:k,text:`Activate ${qLabel(k)}: ${q.label}`,sub:due});
    });
  }
  const quarterly=(p.choice||[]).filter(s=>s.period==="quarter");
  const stale=quarterly.filter(s=>{const x=w.sel[s.id];return x&&x.opts&&x.opts.length&&(!x.quarter||x.quarter<PICK_Q)});
  if(stale.length){
    const summ=quarterly.map(s=>`${s.rate}% ${selLabels(w,s).join(", ")||"not set"}`).join(" · ");
    t.push({kind:"confirm",text:`Confirm ${qLabel(PICK_Q)} picks`,sub:summ});
  }
  (p.choice||[]).forEach(s=>{if(!selOpts(w,s).length)t.push({kind:"pick",text:`Choose ${s.label.replace("Your ","your ")}`,sub:s.note||""})});
  if(p.auto&&!w.autoFocus)t.push({kind:"pick",text:"Set which category you expect to earn 5%",sub:p.auto.note});
  return t;
}
function allTasks(){return state.wallet.flatMap(w=>tasksFor(w).map(t=>({...t,w})))}

let drawerId=null,editingRewards=false,tasksOpen=false;
function openDrawer(id,keep){
  const w=walletById(id);if(!w)return;const p=P(w.product);
  drawerId=id;editingRewards=false;tasksOpen=false;
  if(!p){openSheet(`<div style="font-size:18px;font-weight:700;color:#f1f5f9">${esc(dn(w))}</div>
    <div style="font-size:13px;color:#94a3b8;margin-top:6px">This card isn't in the catalog anymore.</div>
    <button class="btn-ghost" onclick="closeSheet()">Done</button><button class="btn-danger" onclick="removeCard('${w.id}')">Remove from wallet</button>`,keep);return}
  const unit=unitOf(p),brand=B(p.brand);
  const tiers=[];
  (p.rules||[]).forEach(r=>tiers.push({rate:r.rate,t:r.label,s:[r.cond,r.note].filter(Boolean).join(" · ")}));
  (p.choice||[]).forEach(s=>{const l=selLabels(w,s);tiers.push({rate:s.rate,t:`${s.label}: ${l.length?l.join(", "):"not set"}${isDefaultSel(w,s)?" (default)":""}`,s:s.note||""})});
  if(p.rotating){const q=p.rotating.schedule[QK];tiers.push({rate:p.rotating.rate,t:`${qLabel(QK)}: ${q?q.label:"not announced yet"}`,s:p.rotating.cap+(q&&!w.activated.includes(QK)?" · not activated":"")})}
  if(p.auto)tiers.push({rate:p.auto.rate,t:"Your top category"+(w.autoFocus?` (expecting ${catName(w.autoFocus)})`:""),s:p.auto.note});
  tiers.sort((a,b)=>b.rate-a.rate);tiers.push({rate:p.base,t:p.baseLabel||"Everything else",s:""});

  const notes=[...(p.perks||[])];
  w.promos.forEach(pr=>{if(pr.until>=TODAY)notes.unshift(`${pr.label}, until ${shortDate(isoToDate(pr.until))}`)});
  if(w.introApr&&w.introApr>=TODAY)notes.unshift(`0% intro APR until ${isoToDate(w.introApr).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}`);
  if(SHOW.accountDetails&&p.feeNote)notes.push(`Annual fee: ${p.feeNote}`);

  const s=p.source||{};
  openSheet(`
    <div style="display:flex;align-items:center;gap:10px">
      ${cardArt(w.product,64)}
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px;font-weight:700;color:#f1f5f9">${esc(dn(w))}</span>${badge(w.owner)}</div>
        <div style="font-size:12px;color:#94a3b8;margin-top:2px">${esc(brand.name)} ${esc(p.name)} · ${netLabel(netOf(w))}${w.last4?` <span class="mono">•••• ${esc(w.last4)}</span>`:""}</div>
        ${p.status==="closed"?`<div class="tag">No longer offered to new applicants</div>`:""}
      </div>
    </div>

    ${SHOW.accountDetails?`<div style="display:flex;gap:8px;margin-top:16px">
      <div class="stat"><div class="l">Due</div><div class="v">${ordinal(w.dueDay)}</div></div>
      <div class="stat"><div class="l">Limit</div><div class="v">${esc(w.limit)||"—"}</div></div>
      <div class="stat"><div class="l">Fee</div><div class="v">$${p.fee}</div></div>
      <div class="stat" id="rw-box" onclick="editRewards()" style="cursor:pointer">
        <div class="l" style="color:#16a34a">Rewards ✎</div>
        <div class="v mono" style="color:#4ade80">${esc(w.rewards)||"—"}</div>
      </div>
    </div>`:""}

    ${setupHTML(w)}

    <div class="sec">Reward tiers</div>
    ${tiers.map((t,i)=>`
      <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;background:${i===0?"#132216":"#0f172a"};border:1px solid ${i===0?"#16a34a33":"transparent"};margin-bottom:4px">
        <div class="mono" style="font-size:15px;font-weight:700;color:${pctColor(t.rate)};min-width:42px;text-align:right;flex-shrink:0">${fmtRate(t.rate)}${unit}</div>
        <div style="flex:1"><div style="font-size:14px;font-weight:600;color:#e2e8f0">${esc(t.t)}</div>${t.s?`<div style="font-size:11px;color:#94a3b8;margin-top:2px">${esc(t.s)}</div>`:""}</div>
      </div>`).join("")}
    ${p.type!=="cash"?`<div style="font-size:11px;color:#64748b;margin:4px 2px 0">Ranked at ${p.cpp||1}¢ per ${p.type==="miles"?"mile":"point"}.</div>`:""}

    ${notes.length?`<div class="sec">Notes & perks</div>${notes.map(n=>`<div class="box" style="font-size:13px;color:#cbd5e1;line-height:1.4">${esc(n)}</div>`).join("")}`:""}

    <div class="sec">Card details</div>
    <div class="flabel" style="margin-top:0">Nickname</div>
    <input class="field" value="${esc(w.nickname)}" placeholder="${esc(p.short)}" onchange="setField('${w.id}','nickname',this.value.trim())">
    <div style="display:flex;gap:8px">
      <div style="flex:1"><div class="flabel">Last 4</div><input class="field mono" inputmode="numeric" maxlength="4" value="${esc(w.last4)}" onchange="setField('${w.id}','last4',this.value.replace(/\\D/g,'').slice(0,4))"></div>
      ${SHOW.accountDetails?`<div style="flex:1"><div class="flabel">Due day</div><input class="field" inputmode="numeric" maxlength="2" value="${w.dueDay||""}" onchange="setField('${w.id}','dueDay',Math.min(31,Math.max(1,parseInt(this.value)||0))||null)"></div>
      <div style="flex:1.3"><div class="flabel">Limit</div><input class="field" value="${esc(w.limit)}" onchange="setField('${w.id}','limit',this.value.trim())"></div>`:""}
    </div>
    ${p.networkOptions?`<div class="flabel">Network on your card</div><div>${p.networkOptions.map(n=>`<div class="chip ${netOf(w)===n?"on":""}" onclick="setField('${w.id}','network','${n}')">${capWord(n)}</div>`).join("")}</div>`:""}
    <div class="flabel">Belongs to</div>
    <div>${ownerChips(w.owner,`setField('${w.id}','owner','$ID')`)}</div>

    <div style="font-size:11px;color:#64748b;margin-top:18px;line-height:1.6">
      ${s.checked?`Terms checked ${isoToDate(s.checked).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}`:"Terms not yet checked"}${s.url?` · <a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:#4ade80">View source</a>`:""}
      ${s.note?`<br>${esc(s.note)}`:""}<br>Always confirm terms with your card issuer.
    </div>
    <button class="btn-ghost" onclick="closeSheet()">Done</button>
    <button class="btn-danger" onclick="removeCard('${w.id}')">Remove from wallet</button>
  `,keep);
}
function setupHTML(w){
  const p=P(w.product);let h="";
  if(p.rotating){
    const r=p.rotating;
    h+=[QK,NQK].map(k=>{
      const q=r.schedule[k];if(!q)return"";
      const on=w.activated.includes(k);
      const when=k===QK?`Now until ${shortDate(qEnd(k))}`:`Starts ${shortDate(qStart(k))}`;
      const due=r.retroactive?` · activate by ${shortDate(qDeadline(k,r.deadlineDay||31))}`:"";
      return `<div class="box" style="display:flex;align-items:center;gap:10px">
        <div style="flex:1"><div style="font-size:14px;font-weight:600;color:#e2e8f0">${qLabel(k)}: ${esc(q.label)}</div>
        <div style="font-size:11px;color:#94a3b8;margin-top:2px">${when}${due}</div></div>
        <div class="chip ${on?"on":""}" style="margin:0" onclick="toggleAct('${w.id}','${k}')">${on?"✓ Activated":"Mark activated"}</div></div>`;
    }).join("");
    h+=`<div style="font-size:11px;color:#94a3b8;margin:4px 2px 0;line-height:1.5">${esc(r.activateHint||"Activate in your card's app first, then mark it here.")}</div>`;
  }
  const staleSlots=(p.choice||[]).filter(s=>{const x=w.sel[s.id]||{};return s.period==="quarter"&&x.opts&&x.opts.length&&(!x.quarter||x.quarter<PICK_Q)});
  (p.choice||[]).forEach(s=>{
    const x=w.sel[s.id]||{},cur=selOpts(w,s);
    const stale=staleSlots.length&&s===staleSlots[staleSlots.length-1];
    h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:600;color:#e2e8f0;margin-bottom:8px">${s.label} · choose ${s.pick}${s.period==="quarter"?` for ${qLabel(PICK_Q)}`:""}</div>
      ${s.options.map(o=>`<div class="chip ${cur.includes(o.id)?"on":""}" onclick="togglePick('${w.id}','${s.id}','${o.id}')">${catById(o.cats[0])?.emoji||""} ${esc(o.label)}</div>`).join("")}
      ${stale?`<div style="display:flex;align-items:center;gap:8px;margin-top:2px"><span style="font-size:12px;color:#fbbf24;flex:1">Last set for ${qLabel(x.quarter||QK)}</span><button class="btn-sm" onclick="confirmSame('${w.id}',true)">Keep same picks</button></div>`:""}
      ${isDefaultSel(w,s)?`<div style="font-size:11px;color:#94a3b8">Using the card's default until you choose.</div>`:""}
    </div>`;
  });
  if(p.auto){
    h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:600;color:#e2e8f0;margin-bottom:4px">Where do you expect to spend most this month?</div>
      <div style="font-size:11px;color:#94a3b8;margin-bottom:8px">Only that category earns 5%. The app ranks this card at 5% there and 1% everywhere else.</div>
      ${p.auto.options.map(o=>`<div class="chip ${w.autoFocus===o?"on":""}" onclick="setField('${w.id}','autoFocus','${o}')">${catById(o).emoji} ${catName(o)}</div>`).join("")}</div>`;
  }
  return h?`<div class="sec">${p.rotating?"Quarterly bonus":"Your categories"}</div>${h}`:"";
}
function ownerChips(sel,action){
  return state.people.map(p=>`<div class="chip ${sel===p.id?"on":""}" onclick="${action.replace("$ID",p.id)}">${esc(p.name)}</div>`).join("")
    +`<div class="chip" onclick="addPerson('${action.replace(/'/g,"\\'")}')">＋ Person</div>`;
}
function editRewards(){
  if(editingRewards)return;editingRewards=true;
  const w=walletById(drawerId),b=$("rw-box");
  b.style.background="#132216";b.style.borderColor="#16a34a55";b.onclick=null;
  b.innerHTML=`<div class="l" style="color:#16a34a">Editing</div>
    <input id="rw-in" class="mono" value="${esc(w.rewards)}" style="width:100%;max-width:80px;background:transparent;border:none;border-bottom:1px solid #16a34a;color:#4ade80;font-size:13px;font-weight:700;text-align:center;margin-top:2px"
      onblur="saveRewards()" onkeydown="if(event.key==='Enter')this.blur()">`;
  $("rw-in").focus();$("rw-in").select();
}
function saveRewards(){const i=$("rw-in");if(!i)return;walletById(drawerId).rewards=i.value.trim();save();openDrawer(drawerId,true)}
function setField(id,f,v){const w=walletById(id);if(!w)return;w[f]=v;save();openDrawer(id,true)}
function toggleAct(id,k){const w=walletById(id);w.activated=w.activated.includes(k)?w.activated.filter(x=>x!==k):[...w.activated,k];save();if(tasksOpen)renderTasks();else openDrawer(id,true)}
function togglePick(id,slotId,opt){
  const w=walletById(id),s=P(w.product).choice.find(x=>x.id===slotId);
  const cur=(w.sel[slotId]&&w.sel[slotId].opts)||[];
  let next;
  if(cur.includes(opt))next=cur.filter(x=>x!==opt);
  else if(s.pick===1)next=[opt];
  else next=cur.length>=s.pick?[...cur.slice(1),opt]:[...cur,opt];
  w.sel[slotId]={opts:next,quarter:s.period==="quarter"?PICK_Q:undefined};
  save();openDrawer(id,true);
}
function confirmSame(id,fromDrawer){
  const w=walletById(id);
  (P(w.product).choice||[]).forEach(s=>{if(s.period==="quarter"&&w.sel[s.id])w.sel[s.id].quarter=PICK_Q});
  save();fromDrawer?openDrawer(id,true):renderTasks();
}
function removeCard(id){
  if(!confirm("Remove this card from your wallet?"))return;
  state.wallet=state.wallet.filter(w=>w.id!==id);save();closeSheet();
}
function addPerson(action){
  const name=(prompt("Name")||"").trim();if(!name)return;
  const id="P"+Date.now();state.people.push({id,name});save();
  (new Function(action.replace("$ID",id)))();
}

/* ─── Updates sheet ─── */
function openTasks(){tasksOpen=true;renderTasks()}
function renderTasks(){
  const t=allTasks();
  if(!t.length){closeSheet();return}
  tasksOpen=true;
  openSheet(`
    <div style="font-size:18px;font-weight:700;color:#f1f5f9">Card updates</div>
    <div style="font-size:13px;color:#94a3b8;margin:4px 0 14px">Keep these current so every recommendation is right.</div>
    ${t.map(x=>`<div class="task">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="font-size:13px;font-weight:700;color:#f1f5f9">${esc(dn(x.w))}</span>${badge(x.w.owner)}${x.w.last4?`<span class="mono" style="font-size:11px;color:#64748b">••${esc(x.w.last4)}</span>`:""}</div>
      <div style="font-size:14px;color:#e2e8f0;font-weight:600">${esc(x.text)}</div>
      ${x.sub?`<div style="font-size:12px;color:#94a3b8;margin-top:2px">${esc(x.sub)}</div>`:""}
      <div style="display:flex;gap:6px;margin-top:10px">
        ${x.kind==="activate"?`<button class="btn-sm" onclick="toggleAct('${x.w.id}','${x.q}')">I activated it</button>`:""}
        ${x.kind==="confirm"?`<button class="btn-sm" onclick="confirmSame('${x.w.id}')">Keep same picks</button><button class="btn-sm alt" onclick="openDrawer('${x.w.id}')">Change</button>`:""}
        ${x.kind==="pick"?`<button class="btn-sm" onclick="openDrawer('${x.w.id}')">Choose</button>`:""}
      </div></div>`).join("")}
    <button class="btn-ghost" onclick="closeSheet()">Done</button>`,true);
}

/* ─── Card art & brand helpers ─── */
function productsOf(k){return Object.entries(CATALOG.products).filter(([,p])=>p.brand===k).sort((a,b)=>(ownedCount(a[0])>0)-(ownedCount(b[0])>0)||(a[1].status==="closed")-(b[1].status==="closed")||a[1].name.localeCompare(b[1].name))}
function cardArt(pid,miniWidth){
  const p=P(pid);const b=p?B(p.brand):B("?");const[c1,c2]=ART[pid]||b.colors;
  const bg=`background:linear-gradient(135deg,${c1},${c2})`;
  const light=(pid==="apple_card"||pid==="amex_platinum")?";color:#111827":"";
  if(miniWidth||!p)return `<div class="art mini" style="${bg};width:${miniWidth||46}px"><div class="art-band"></div><div class="art-chip"></div></div>`;
  return `<div class="art" style="${bg}${light}"><div class="art-band"></div><div class="art-iss">${esc(b.short||b.name)}</div><div class="art-chip"></div><div class="art-name">${esc(p.name)}</div><div class="art-net">${esc(netLabel(p.network))}</div></div>`;
}
function monogram(b,size){return `<div class="mono-logo" style="width:${size}px;height:${size}px;background:linear-gradient(135deg,${b.colors[0]},${b.colors[1]});font-size:${Math.round(size*.34)}px">${esc(b.mono)}</div>`}
const ownedCount=pid=>state.wallet.filter(w=>w.product===pid).length;

/* ─── Add card: bank → cards → details ─── */
let addQ="",addIss=null,draft=null;
function openAdd(){addQ="";addIss=null;draft=null;tasksOpen=false;renderBanks(false)}
function renderBanks(still=true){
  addIss=null;
  openSheet(`
    <div class="add-title">Add a card</div>
    <div class="add-sub">Choose your bank</div>
    <div class="add-search"><span style="font-size:15px;opacity:.7">🔍</span>
      <input id="add-q" type="search" placeholder="Search banks or cards" value="${esc(addQ)}" autocomplete="off" oninput="addQ=this.value;renderAddBody()"></div>
    <div id="add-body"></div>
    <button class="btn-ghost" onclick="closeSheet()">Cancel</button>`,false,still);
  renderAddBody();
}
function bankTile(k){const b=B(k),n=productsOf(k).length;
  return `<div class="bank-tile" onclick="openBank('${k}')">${monogram(b,48)}<div class="bank-name">${esc(b.name)}</div><div class="bank-count">${n} card${n>1?"s":""}</div></div>`}
function renderAddBody(){
  const q=addQ.trim().toLowerCase();
  const banks=Object.keys(CATALOG.brands).filter(k=>productsOf(k).length).sort((a,b)=>B(a).name.localeCompare(B(b).name));
  if(!q){$("add-body").innerHTML=`<div class="bank-grid">${banks.map(bankTile).join("")}</div>`;return}
  const mb=banks.filter(k=>(B(k).name+" "+B(k).short+" "+(B(k).note||"")).toLowerCase().includes(q));
  const mc=Object.entries(CATALOG.products).filter(([,p])=>(B(p.brand).name+" "+p.name+" "+p.short).toLowerCase().includes(q)).map(([id])=>id);
  $("add-body").innerHTML=
    (mb.length?`<div class="add-sec">Banks</div><div class="bank-grid" style="margin-top:6px">${mb.map(bankTile).join("")}</div>`:"")+
    (mc.length?`<div class="add-sec">Cards</div>${mc.map(cardCompact).join("")}`:"")+
    (!mb.length&&!mc.length?`<div class="empty">No banks or cards match “${esc(addQ)}”</div>`:"");
}
function cardCompact(id){const p=P(id),owned=ownedCount(id);
  return `<div class="compact" ${owned&&SINGLE_CARD_PER_PRODUCT?'style="opacity:.55;cursor:default"':`onclick="startAdd('${id}')"`}>${cardArt(id,72)}
    <div style="flex:1;min-width:0"><div style="font-size:11px;color:#64748b;font-weight:600">${esc(B(p.brand).name)}</div>
      <div style="font-size:15px;font-weight:700;color:#f1f5f9">${esc(p.name)}</div>
      <div style="font-size:12px;color:#94a3b8;margin-top:1px">${netLabel(p.network)}${owned?' · <span style="color:#4ade80">In wallet</span>':""}</div></div>
    ${owned&&SINGLE_CARD_PER_PRODUCT?`<button class="btn-sm alt" disabled style="opacity:.6;cursor:default">Already added</button>`:`<button class="btn-sm" onclick="event.stopPropagation();startAdd('${id}')">Add</button>`}</div>`}
let bankQ="";
function openBank(k){addIss=k;bankQ="";renderBankCards()}
function renderBankList(){
  const q=bankQ.trim().toLowerCase(),items=productsOf(addIss).filter(([,p])=>!q||(p.name+" "+p.short).toLowerCase().includes(q));
  $("bank-list").innerHTML=items.map(([id])=>cardFull(id)).join("")||`<div class="empty">No ${esc(B(addIss).name)} cards match “${esc(bankQ)}”</div>`;
}
function renderBankCards(){
  const b=B(addIss),items=productsOf(addIss);
  openSheet(`
    <div class="add-back" onclick="renderBanks()">‹ All banks</div>
    <div style="display:flex;align-items:center;gap:12px;margin:10px 0 16px">${monogram(b,44)}
      <div><div class="add-title">${esc(b.name)}</div><div style="font-size:13px;color:#94a3b8">${b.note?esc(b.note):`${items.length} card${items.length>1?"s":""}`}</div></div></div>
    ${items.length>3?`<div class="add-search" style="margin-bottom:12px"><span style="font-size:15px;opacity:.7">🔍</span>
      <input type="search" placeholder="Search ${esc(b.short||b.name)} cards" value="${esc(bankQ)}" autocomplete="off" oninput="bankQ=this.value;renderBankList()"></div>`:""}
    <div id="bank-list"></div>
    <button class="btn-ghost" onclick="closeSheet()">Cancel</button>`,false,true);
  renderBankList();
}
function cardFull(id){const p=P(id),owned=ownedCount(id);
  return `<div class="offer" ${owned&&SINGLE_CARD_PER_PRODUCT?'style="opacity:.6"':""}>
    <div class="offer-art">${cardArt(id)}</div>
    <div class="offer-name" style="margin-bottom:4px">${esc(B(p.brand).name)} ${esc(p.name)}</div>
    <div style="font-size:13px;color:#94a3b8;margin-bottom:14px">${netLabel(p.network)}${p.business?" · Business":""}${p.status==="closed"?" · No longer offered":""}${owned?' · <span style="color:#4ade80;font-weight:600">✓ In your wallet</span>':""}</div>
    ${owned&&SINGLE_CARD_PER_PRODUCT?`<button class="btn" disabled>Already added</button>`:`<button class="btn" onclick="startAdd('${id}')">${owned?"Add another":"Add"}</button>`}
  </div>`}
function startAdd(pid){if(SINGLE_CARD_PER_PRODUCT&&ownedCount(pid))return;const p=P(pid);draft={product:pid,owner:state.people[0]?.id||"",nickname:"",last4:"",network:p.network};renderDraft(false)}
function renderDraft(keep=true){
  const p=P(draft.product);
  openSheet(`
    <div class="add-back" onclick="${addIss?"renderBankCards()":"renderBanks()"}">‹ Back</div>
    <div style="max-width:220px;margin:12px auto 14px">${cardArt(draft.product)}</div>
    <div style="text-align:center;font-size:18px;font-weight:700;color:#f1f5f9">${esc(B(p.brand).name)} ${esc(p.name)}</div>
    <div style="text-align:center;font-size:13px;color:#94a3b8;margin-top:2px">${netLabel(draft.network)}</div>
    <div class="flabel" style="margin-top:18px">Whose card is this?</div>
    <div>${ownerChips(draft.owner,"draft.owner='$ID';renderDraft()")}</div>
    ${p.networkOptions?`<div class="flabel">Which logo is on your card?</div><div>${p.networkOptions.map(n=>`<div class="chip ${draft.network===n?"on":""}" onclick="draft.network='${n}';renderDraft()">${capWord(n)}</div>`).join("")}</div>`:""}
    <div class="flabel">Last 4 digits (optional)</div>
    <input class="field mono" inputmode="numeric" maxlength="4" placeholder="1234" value="${esc(draft.last4)}" oninput="draft.last4=this.value.replace(/\\D/g,'').slice(0,4)">
    <div class="flabel">Nickname (optional)</div>
    <input class="field" placeholder="${esc(p.short)}" value="${esc(draft.nickname)}" oninput="draft.nickname=this.value">
    <div style="font-size:12px;color:#64748b;margin-top:8px;line-height:1.5">Never enter your full card number. The last 4 only helps you spot the card at checkout.</div>
    <div style="height:16px"></div>
    <button class="btn" onclick="addCard()">Add to wallet</button>`,keep,true);
}
function addCard(){
  const p=P(draft.product);
  const w=normalize({id:"w"+Date.now(),product:draft.product,owner:draft.owner,nickname:draft.nickname.trim(),last4:draft.last4,rewards:"",dueDay:null,limit:""});
  if(p.networkOptions&&draft.network!==p.network)w.network=draft.network;
  state.wallet.push(w);save();draft=null;
  if(p.choice||p.rotating||p.auto)openDrawer(w.id);else closeSheet();
  refreshAll();
}

/* ─── Init ─── */
switchTab("quick");
syncCatalog();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>

</html>
