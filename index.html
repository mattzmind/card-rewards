/* back = {label, fn}: shows a floating back bubble and turns on swipe-back */
let sheetBack=null;
function openSheet(html,keepScroll,back,opts={}){
  const s=$("sheet"),prev=keepScroll===true?s.querySelector(".sheet")?.scrollTop:(typeof keepScroll==="number"?keepScroll:0);
  sheetBack=back||null;
  s.hidden=false;s.onclick=e=>{if(e.target===s)closeSheet()};
  s.innerHTML=`<div class="sheet ${keepScroll?"still":""} ${opts.customTop?"custom-top":""}" role="dialog" aria-modal="true">${opts.customTop?`<div class="handle"></div>`:`<div class="sheet-top"><div class="handle"></div>${
    back?`<button class="bubble back" onclick="sheetGoBack()" aria-label="Back to ${esc(back.label)}">${ic("chevL")}</button>`:""}<button class="bubble close" onclick="closeSheet()" aria-label="Close">${ic("x")}</button></div>`}${html}</div>`;
  const sh=s.querySelector(".sheet");if(sh){sh.scrollTop=prev||0;sheetGestures(sh,closeSheet,()=>sheetBack&&sheetBack.fn)}
  document.body.classList.add("locked");
}
function sheetGoBack(){if(sheetBack)sheetBack.fn()}
/* Swipe down from the top to close; swipe sideways to go back when there is a back step.
   Used by every pop-up (sheets and the Pay answer) so they all feel the same. */
function sheetGestures(sh,close,getBack){
  let x0=0,y0=0,sc0=0,mode=null,dx=0,dy=0,t0=0;
  const reset=()=>{sh.classList.add("settle");sh.style.transform="";sh.style.opacity="";setTimeout(()=>sh.classList.remove("settle"),220)};
  sh.addEventListener("touchstart",e=>{
    if(e.touches.length>1){mode="none";return}
    const t=e.touches[0];x0=t.clientX;y0=t.clientY;sc0=sh.scrollTop;dx=dy=0;t0=performance.now();
    mode=e.target.closest("input,textarea,select")?"none":null;
  },{passive:true});
  sh.addEventListener("touchmove",e=>{
    if(mode==="none")return;
    const t=e.touches[0];dx=t.clientX-x0;dy=t.clientY-y0;
    if(!mode){
      if(Math.abs(dx)+Math.abs(dy)<10)return;
      if(getBack()&&Math.abs(dx)>Math.abs(dy)*1.4)mode="h";
      else if(dy>0&&sc0<=0&&sh.scrollTop<=0&&dy>Math.abs(dx))mode="v";
      else{mode="none";return}
    }
    e.preventDefault();
    if(mode==="v")sh.style.transform=`translateY(${Math.max(0,dy)}px)`;
    else{sh.style.transform=`translateX(${dx*.6}px)`;sh.style.opacity=String(Math.max(.5,1-Math.abs(dx)/600))}
  },{passive:false});
  const end=()=>{
    if(mode==="v"){
      if(dy>90||(dy>40&&performance.now()-t0<250)){sh.classList.add("settle");sh.style.transform="translateY(100%)";setTimeout(close,180)}else reset();
    }else if(mode==="h"){
      const fn=getBack();if(Math.abs(dx)>70&&fn)fn();else reset();
    }
    mode=null;
  };
  sh.addEventListener("touchend",end);sh.addEventListener("touchcancel",()=>{if(mode)reset();mode=null});
}
function closeSheet(){sheetBack=null;$("sheet").hidden=true;$("sheet").innerHTML="";if($("answer").hidden&&$("onboard").hidden)document.body.classList.remove("locked");render();if(answerCtx)renderAnswer()}

  (p.rules||[]).forEach(r=>tiers.push({rate:r.rate,t:r.label,s:[r.cond,r.note].filter(Boolean).join(" · ")}));
  (p.choice||[]).forEach(s=>{const l=selLabels(w,s);tiers.push({rate:s.rate,t:`${s.label}: ${l.length?l.join(", "):"not set"}${isDefaultSel(w,s)?" (default)":""}`,s:s.note||""})});

function setupHTML(w){
  const p=P(w.product);let h="";
  if(p.rotating){
    const r=p.rotating;
    h+=[QK,NQK].map(k=>{const q=r.schedule[k];if(!q)return"";const on=w.activated.includes(k);
      const when=k===QK?`Now until ${shortDate(qEnd(k))}`:`Starts ${shortDate(qStart(k))}`;
      const due=r.retroactive?` · activate by ${shortDate(qDeadline(k,r.deadlineDay||31))}`:"";
      return `<div class="row static"><span class="row-main"><span class="row-title">${qLabel(k)}: ${esc(q.label)}</span><span class="row-sub">${when}${due}</span></span>
        <button class="chip ${on?"on":""}" onclick="toggleAct('${w.id}','${k}')">${on?ic("check")+"Activated":"Mark activated"}</button></div>`}).join("");
    h+=`<p class="hint">${esc(r.activateHint||"Activate in your card's app first, then mark it here.")}</p>`;
  }
  if((p.choice||[]).length)h+=picksHTML(w,p);
  if(p.auto){
    h+=`<div class="pick-card"><div class="pick-slot"><div class="pick-rate mono">${fmtRate(p.auto.rate)}%</div><div class="pick-main">
      <div class="pick-label">Where will you spend most this month?</div><p class="hint" style="margin:2px 0 8px">Only your top category earns ${fmtRate(p.auto.rate)}%. This is a guess you can change any time.</p>
      <label class="select-wrap"><select class="select" onchange="setField('${w.id}','autoFocus',this.value)">
        <option value="" ${w.autoFocus?"":"selected"} disabled>Choose a category</option>
        ${p.auto.options.map(o=>`<option value="${o}" ${w.autoFocus===o?"selected":""}>${esc(catName(o))}</option>`).join("")}</select>${ic("chevD")}</label></div></div></div>`;
  }
  return h?`<h3 class="sec">${p.rotating?"Quarterly bonus":"Your categories"}</h3>${h}`:"";
}
function ownerChips(sel,action){
  return state.people.map(p=>`<button class="chip ${sel===p.id?"on":""}" onclick="${action.replace("$ID",p.id)}">${esc(p.name)}</button>`).join("");
}
function setField(id,f,v){const w=walletById(id);if(!w)return;w[f]=v;save();openDrawer(id,true)}
function toggleAct(id,k){const w=walletById(id);w.activated=w.activated.includes(k)?w.activated.filter(x=>x!==k):[...w.activated,k];save();

/* Chosen categories (U.S. Bank Cash+, BoA, Bilt, Citi Strata…): one dropdown per pick, then Save.
   Once saved they're locked; changing them takes Edit → confirm → Save, for fixing a mistake. */
function picksHTML(w,p){
  const slots=p.choice,editing=pickEdit&&pickEdit.wid===w.id;
  const saved=s=>{const x=w.sel[s.id];return !!(x&&x.opts&&x.opts.length)};
  const needs=slots.some(s=>!saved(s)&&!isDefaultSel(w,s));
  if(!editing&&needs){pickEdit={wid:w.id,draft:Object.fromEntries(slots.map(s=>[s.id,[...selOpts(w,s)]]))};return picksHTML(w,p)}
  const per=slots.some(s=>s.period==="quarter")?` for ${qLabel(PICK_Q)}`:"";
  if(!editing){
    const stale=slots.filter(s=>s.period==="quarter"&&saved(s)&&(!w.sel[s.id].quarter||w.sel[s.id].quarter<PICK_Q));
    return `<div class="pick-card saved">${slots.map(s=>`<div class="pick-slot"><div class="pick-rate mono">${fmtRate(s.rate)}%</div><div class="pick-main">
        <div class="pick-label">${esc(s.label.replace(/^Your /,"").replace(/^\w/,c=>c.toUpperCase()))}</div>
        <div class="pick-values">${selLabels(w,s).map(l=>`<span class="pick-val">${esc(l)}</span>`).join("")||`<span class="dim">Not set</span>`}${isDefaultSel(w,s)?`<span class="dim"> (card default)</span>`:""}</div></div></div>`).join("")}
      <div class="pick-foot">${ic("check")}<span>${stale.length?`Saved for ${qLabel(w.sel[stale[0].id].quarter||QK)}`:`Saved${per}`}</span>
        <button class="btn-sm alt" onclick="askEditPicks('${w.id}')">${ic("edit")}Edit</button></div>
      ${stale.length?`<div class="pick-new">New quarter: keep the same picks for ${qLabel(PICK_Q)}? <button class="btn-sm" onclick="confirmSame('${w.id}',true)">Keep same</button></div>`:""}</div>`;
  }
  const d=pickEdit.draft,complete=slots.every(s=>(d[s.id]||[]).filter(Boolean).length===s.pick);
  return `<div class="pick-card editing">${slots.map(s=>{
      const cur=d[s.id]||[];
      return `<div class="pick-slot"><div class="pick-rate mono">${fmtRate(s.rate)}%</div><div class="pick-main">
        <div class="pick-label">Choose ${s.pick}${s.period==="quarter"?per:""}</div>${s.note?`<p class="hint" style="margin:0 0 6px">${esc(s.note)}</p>`:""}
        ${Array.from({length:s.pick},(_,i)=>{const taken=cur.filter((v,j)=>j!==i&&v);
          return `<label class="select-wrap"><select class="select" onchange="setPickDraft('${w.id}','${s.id}',${i},this.value)" aria-label="${esc(s.label)} pick ${i+1}">
            <option value="" ${cur[i]?"":"selected"}>Choose a category</option>
            ${s.options.filter(o=>!taken.includes(o.id)).map(o=>`<option value="${o.id}" ${cur[i]===o.id?"selected":""}>${esc(o.label)}</option>`).join("")}</select>${ic("chevD")}</label>`}).join("")}
      </div></div>`}).join("")}
    <p class="hint">Pick the same categories you chose with ${esc(B(p.brand).name)}. Most banks lock them until next quarter.</p>
    <div class="pick-actions">${slots.some(saved)?`<button class="btn-outline" onclick="pickEdit=null;openDrawer('${w.id}',true)">Cancel</button>`:""}
      <button class="btn" ${complete?"":"disabled"} onclick="savePicks('${w.id}')">Save categories</button></div></div>`;
}
function setPickDraft(wid,slotId,i,val){const a=pickEdit.draft[slotId]=pickEdit.draft[slotId]||[];a[i]=val||undefined;openDrawer(wid,true)}
function askEditPicks(wid){
  confirmDialog("Edit your saved categories?","Use this to fix a mistake or match a change you made with your bank. Your new picks replace the saved ones.","Edit",()=>{
    const w=walletById(wid),p=P(w.product);pickEdit={wid,draft:Object.fromEntries(p.choice.map(s=>[s.id,[...selOpts(w,s)]]))};openDrawer(wid,true)},"primary");
}
function savePicks(wid){
  const w=walletById(wid),p=P(w.product),before=JSON.parse(JSON.stringify(w.sel));
  p.choice.forEach(s=>{w.sel[s.id]={opts:(pickEdit.draft[s.id]||[]).filter(Boolean).slice(0,s.pick),quarter:s.period==="quarter"?PICK_Q:undefined}});
  pickEdit=null;save();openDrawer(wid,true);render();if(answerCtx)renderAnswer();
  toast("Categories saved",()=>{w.sel=before;save();render();if(drawerId===wid&&!$("sheet").hidden)openDrawer(wid,true)});

function togglePick(id,slotId,opt){
  const w=walletById(id),s=P(w.product).choice.find(x=>x.id===slotId);
  const cur=(w.sel[slotId]&&w.sel[slotId].opts)||[];let next;
  if(cur.includes(opt))next=cur.filter(x=>x!==opt);else if(s.pick===1)next=[opt];else next=cur.length>=s.pick?[...cur.slice(1),opt]:[...cur,opt];
  w.sel[slotId]={opts:next,quarter:s.period==="quarter"?PICK_Q:undefined};save();openDrawer(id,true);

function confirmSame(id,fromDrawer){const w=walletById(id);
  (P(w.product).choice||[]).forEach(s=>{if(s.period==="quarter"&&w.sel[s.id])w.sel[s.id].quarter=PICK_Q});
  save();if(fromDrawer)openDrawer(id,true);else{render();toast("Picks confirmed")}}
function drawerButtons(w){
  return `<div class="action-stack">
    <button class="btn" onclick="closeSheet()">Done</button>
    ${w.inactive?`<button class="btn-outline" onclick="setInactive(['${w.id}'],false)">${ic("restore")}Reactivate card</button>`

function removeCard(id){removeCards([id])}
function removeCards(ids){
  const ws=ids.map(walletById).filter(Boolean);if(!ws.length)return;
  const name=ws.length===1?dn(ws[0]):`${ws.length} cards`;
  confirmDialog(`Remove ${name}?`,ws.length===1?"It will be deleted from your wallet and its history. To keep it in your history, deactivate it instead."
      :"They will be deleted from your wallet and its history. To keep them in your history, deactivate them instead.","Remove",()=>{
    const before=[...state.wallet];state.wallet=state.wallet.filter(w=>!ids.includes(w.id));save();
    selectMode=null;closeSheet();if(answerCtx)renderAnswer();

function setInactive(ids,off,confirmed){
  if(off&&!confirmed){
    const ws=ids.map(walletById).filter(Boolean);if(!ws.length)return;
    const one=ws.length===1,name=one?dn(ws[0]):`${ws.length} cards`;
    confirmDialog(`Deactivate ${name}?`,`${one?"It":"They"} will move to your deactivated cards and stop showing on Earn and in notifications. You can reactivate ${one?"it":"them"} any time.`,
      "Deactivate",()=>setInactive(ids,true,true),"primary");
    return;
  }
  closeSwipes();
  ids.forEach(id=>{const w=walletById(id);if(!w)return;if(off)w.inactive=TODAY;else delete w.inactive});save();
  const n=ids.length,name=n===1?dn(walletById(ids[0])):`${n} cards`;
  if(off)showInactive=false;
  selectMode=null;closeSheet();if(answerCtx)renderAnswer();
  toast(`${name} ${off?"deactivated":"reactivated"}`,()=>{ids.forEach(id=>{const w=walletById(id);if(!w)return;if(off)delete w.inactive;else w.inactive=TODAY});save();render();if(answerCtx)renderAnswer()});
}

/* ─── Confirm pop-up ─── */
let dialogFn=null;
function confirmDialog(title,msg,okLabel,fn,kind="danger"){
  dialogFn=fn;const d=$("dialog");
  d.innerHTML=`<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t"><h2 id="dlg-t">${esc(title)}</h2><p>${esc(msg)}</p>
    <div class="dialog-btns"><button class="btn-outline" onclick="closeDialog()">Cancel</button><button class="btn ${kind==="danger"?"danger":""}" onclick="const f=dialogFn;closeDialog();f&&f()">${esc(okLabel)}</button></div></div>`;
  d.hidden=false;d.onclick=e=>{if(e.target===d)closeDialog()};
}
function closeDialog(){$("dialog").hidden=true;$("dialog").innerHTML="";dialogFn=null}

/* ─── Wallet menu (⋮) and select mode ─── */
/* ⋮ opens a small menu under the button (like Todoist), not a sheet */

function closePopover(){const p=$("popover");p.hidden=true;p.innerHTML=""}

function renderBankCards(){
  const b=B(addIss),items=productsOf(addIss);
  openSheet(`<h2 class="sheet-title">${esc(b.name)}</h2><p class="sheet-sub">${b.note?esc(b.note):`${items.length} card${items.length>1?"s":""}`}</p>
    ${items.length>3?searchRow("bank-q",`Search ${b.short||b.name} cards`,bankQ,"bankQ=this.value;renderBankList()","clearBankSearch()"):""}
    <div id="bank-list" class="offers"></div>`,bankCardsScroll||0.001,{label:"All banks",fn:()=>renderBanks()});
  renderBankList();$("sheet").querySelector(".sheet").scrollTop=bankCardsScroll||0;
}
function cardFull(id){const p=P(id),owned=ownedCount(id)&&SINGLE_CARD_PER_PRODUCT;
  return `<div class="offer ${owned?"muted":""}"><div class="offer-art">${cardArt(id)}</div>
    <div class="row-title">${esc(B(p.brand).name)} ${esc(p.name)}</div>
    <div class="row-sub">${netLabel(p.network)}${p.business?" · Business":""}${p.status==="closed"?" · No longer offered":""}${owned?(inactiveOf(id)?" · Deactivated":" · In your wallet"):""}</div>
    ${owned?(inactiveOf(id)?`<button class="btn" onclick="reactivateFromAdd('${id}')">Reactivate</button>`:`<button class="btn" disabled>Already added</button>`):`<button class="btn" onclick="startAdd('${id}')">Add</button>`}</div>`}
function startAdd(pid){if(SINGLE_CARD_PER_PRODUCT&&ownedCount(pid))return;if(addIss)bankCardsScroll=curScroll();else banksScroll=curScroll();const p=P(pid);draft={product:pid,owner:state.people[0]?.id||"",nickname:"",last4:"",network:p.network};renderDraft(false)}
function renderDraft(keep=true){
  const p=P(draft.product);
  openSheet(`<div class="offer-art small">${cardArt(draft.product)}</div>
    <h2 class="sheet-title center">${esc(B(p.brand).name)} ${esc(p.name)}</h2>
    ${SHOW.multiPeople&&state.people.length>1?`<div class="flabel">Whose card is this?</div><div class="chips">${ownerChips(draft.owner,"draft.owner='$ID';renderDraft()")}</div>`:""}
    ${p.networkOptions?`<div class="flabel">Which logo is on your card?</div><div class="chips">${p.networkOptions.map(n=>`<button class="chip ${draft.network===n?"on":""}" onclick="draft.network='${n}';renderDraft()">${capWord(n)}</button>`).join("")}</div>`:""}
    <label class="flabel" for="d-last4">Last 4 digits (optional)</label>
    <input class="field mono" id="d-last4" inputmode="numeric" maxlength="4" placeholder="1234" value="${esc(draft.last4)}" oninput="draft.last4=this.value.replace(/\\D/g,'').slice(0,4)">
    <label class="flabel" for="d-nick">Nickname (optional)</label>
    <input class="field" id="d-nick" placeholder="${esc(p.short)}" value="${esc(draft.nickname)}" oninput="draft.nickname=this.value">
    <p class="hint">Never enter your full card number. The last 4 only help you spot the card at checkout.</p>
    <button class="btn" onclick="addCard()">Add to wallet</button>`,keep,{label:addIss?B(addIss).short||B(addIss).name:"Back",fn:()=>addIss?renderBankCards():renderBanks()});
}
function addCard(){
  const p=P(draft.product);
  const w=normalize({id:"w"+Date.now(),product:draft.product,owner:draft.owner,nickname:draft.nickname.trim(),last4:draft.last4,rewards:"",dueDay:null,limit:""});
  if(p.networkOptions&&draft.network!==p.network)w.network=draft.network;
  state.wallet.push(w);state.onboarded=true;save();draft=null;
  if(p.choice||p.rotating||p.auto)openDrawer(w.id);else{closeSheet();toast(`${dn(w)} added`)}
}

/* ─── First run: welcome → your name → your cards → a first answer ───
   openOnboard(3) opens only the card step (from the empty Earn screen). */
let obStep=1,obOnly=false,obSel=new Set(),obQ="",obAdded=0,obDir="";
const OB_PREVIEW=["grocery","dining","gas"];
function openOnboard(step=1){obStep=step;obOnly=step===3;obSel=new Set();obQ="";obAdded=0;obDir="";
  $("onboard").hidden=false;document.body.classList.add("locked");renderOnboard()}
function obGo(step){obDir=step<obStep?"back":"fwd";obStep=step;renderOnboard()}
function renderOnboard(){
  const o=$("onboard"),nm=myName(),dots=!obOnly&&obStep>1;
  o.classList.toggle("ob-dark",obStep===1);
  const top=obStep===1?"":`<div class="ob-top">${obStep>1&&!obOnly?`<button class="round-btn ob-back" onclick="obGo(${obStep-1})" aria-label="Back">${ic("chevL")}</button>`:obOnly?`<button class="round-btn ob-back" onclick="closeOnboard()" aria-label="Close">${ic("x")}</button>`:"<span></span>"}
    ${dots?`<div class="ob-dots" aria-label="Step ${obStep-1} of 3">${[2,3,4].map(s=>`<span class="${s<=obStep?"on":""}"></span>`).join("")}</div>`:""}<span class="ob-top-pad"></span></div>`;
  let body="",bar="";
  if(obStep===1){
    const fan=POPULAR_CARDS.filter(P).slice(0,3);
    body=`<div class="ob-brand">${BRAND_MARK}<span>lucro</span></div>
      <div class="ob-fan" aria-hidden="true">${fan.map((id,i)=>`<div class="ob-fan-card f${i}">${cardArt(id,0,true)}</div>`).join("")}</div>
      <h1>Get paid back on every purchase.</h1>
      <div class="ob-vals">
        ${[["tag","The right card at every store","Search any store and see which card earns the most."],
           ["bolt","Never miss a bonus","Reminders for quarterly activations and category picks."],
           ["lock","Private by design","Your cards stay on this phone. No bank logins, ever."]]
          .map(([i,t,s])=>`<div class="ob-val"><span class="ob-val-ic">${ic(i)}</span><span><b>${t}</b><span>${s}</span></span></div>`).join("")}
      </div>`;
    bar=`<button class="btn" onclick="obGo(2)">Get started</button>
      <label class="ob-restore">Have a backup? <u>Restore it</u><input type="file" accept="application/json,.json" hidden onchange="importWallet(this.files[0])"></label>`;
  }else if(obStep===2){
    body=`<h1>What should we call you?</h1><p>Just your first name, so Lucro feels like yours.</p>
      <input class="field ob-name-field" id="ob-name" value="${esc(state.profile.name||"")}" placeholder="First name" maxlength="30"
        autocomplete="given-name" autocapitalize="words" enterkeyhint="next" oninput="$('ob-next').disabled=!this.value.trim()" onkeydown="if(event.key==='Enter'&&this.value.trim())obSaveName()">`;
    bar=`<div class="ob-bar-row"><button class="btn-ghost" onclick="obGo(3)">Skip</button><button id="ob-next" class="btn" onclick="obSaveName()" ${nm?"":"disabled"}>Continue</button></div>`;
  }else if(obStep===3){
    body=`<h1>${nm?`Hi ${esc(nm)}, which cards do you carry?`:"Which cards do you carry?"}</h1><p>Tap every card in your wallet. You can add more any time.</p>
      <label class="search" for="ob-q">${ic("search")}<input id="ob-q" type="search" placeholder="Search all cards" autocomplete="off" value="${esc(obQ)}" oninput="obSearch(this.value)"></label>
      <div id="ob-grid" class="ob-grid"></div>`;
    bar=`<div class="ob-bar-row"><button class="btn-ghost" onclick="obCards(true)">${obOnly?"Cancel":"Later"}</button><button id="ob-add" class="btn" onclick="obCards(false)" disabled>Tap the cards you carry</button></div>`;
  }else{
    const picks=OB_PREVIEW.map(id=>{const c=catById(id),b=c&&rank(c)[0];return b?{c,b}:null}).filter(Boolean);
    body=`<div class="ob-done-ic">${ic("check")}</div><h1>${nm?`You're all set, ${esc(nm)}.`:"You're all set."}</h1>
      ${picks.length?`<p>Here's what Lucro picks from your wallet:</p>
        <div class="list ob-picks">${picks.map(({c,b})=>`<div class="row static"><span class="row-ic">${ic(c.id)}</span><span class="row-main"><span class="row-sub">${esc(c.label)}</span><span class="row-title">${esc(dn(b.w))}</span></span><span class="ob-rate">${fmtRate(b.rate)}%</span></div>`).join("")}</div>
        <p class="hint">Search any store on Earn to get the best card for it.</p>`
      :`<p>Add your cards any time from the Wallet tab, and Lucro will pick the best one for every purchase.</p>`}`;
    bar=`<button class="btn" onclick="obDone()">${obAdded?"Start earning":"Explore Lucro"}</button>`;
  }
  o.innerHTML=`<div class="ob-inner ob-step ${obDir}">${top}${body}</div><div class="ob-bar"><div class="ob-bar-in">${bar}</div></div>`;
  if(obStep===3)renderObGrid();
  if(obStep===2)setTimeout(()=>{const i=$("ob-name");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250);
  o.scrollTop=0;
}
function renderObGrid(){
  const q=obQ.trim().toLowerCase();
  const ids=q?Object.keys(CATALOG.products).filter(id=>{const p=P(id);return (B(p.brand).name+" "+p.name+" "+p.short).toLowerCase().includes(q)}).slice(0,30):POPULAR_CARDS.filter(P);
  $("ob-grid").innerHTML=ids.map(id=>{const p=P(id),on=obSel.has(id),own=ownedCount(id)>0;
    return `<button class="ob-card ${on?"on":""}" ${own?"disabled":""} onclick="obToggle('${id}')" aria-pressed="${on}">${cardArt(id)}
      <span class="ob-name">${esc(B(p.brand).short)} ${esc(p.name)}</span>${on?`<span class="ob-check">${ic("check")}</span>`:""}${own?`<span class="ob-owned">In wallet</span>`:""}</button>`}).join("")||`<p class="hint">No cards match “${esc(obQ)}”.</p>`;
  const n=obSel.size;
  $("ob-add").disabled=!n;$("ob-add").textContent=n?`Add ${n} card${n>1?"s":""}`:"Tap the cards you carry";
}
function obToggle(id){obSel.has(id)?obSel.delete(id):obSel.add(id);renderObGrid()}
function obSearch(v){obQ=v;renderObGrid()}
function obSaveName(){const v=$("ob-name").value.trim();if(!v)return;setMyName(v);obGo(3)}
function obCards(skip){
  if(!skip)[...obSel].filter(id=>!ownedCount(id)).forEach(id=>{obAdded++;state.wallet.push(normalize({id:"w"+Date.now()+Math.random().toString(36).slice(2,6),product:id,owner:state.people[0]?.id||"",nickname:"",last4:"",rewards:"",dueDay:null,limit:""}))});
  obSel=new Set();save();
  if(obOnly){if(skip)closeOnboard();else obDone();return}
  obGo(4);
}
function closeOnboard(){$("onboard").hidden=true;$("onboard").innerHTML="";document.body.classList.remove("locked")}
function obDone(){
  state.onboarded=true;state.profile.since=state.profile.since||TODAY;save();closeOnboard();
  go("pay");
  if(obAdded){const t=allTasks().length;toast(`${obAdded} card${obAdded>1?"s":""} added${t?". A few need a quick setup.":""}`);if(t)setTimeout(openNotifs,600)}
}

/* ─── Backup: a file you can keep in iCloud Drive / Files and restore on any phone ─── */
function exportWallet(){
  const data=JSON.stringify({app:"card-maximizer",saved:new Date().toISOString(),state},null,1);
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));
  a.download=`lucro-backup-${TODAY}.json`;document.body.appendChild(a);a.click();a.remove();
  state.backedUp=TODAY;save();render();toast("Backup saved to your downloads");
}
function importWallet(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result),s=d.state||d;if(!s||!Array.isArray(s.wallet))throw 0;
      const before=JSON.stringify(state);
      s.wallet.forEach(normalize);Object.keys(state).forEach(k=>delete state[k]);Object.assign(state,s);
      state.recents=state.recents||[];state.usage=state.usage||{};state.reports=state.reports||[];state.favs=state.favs||[];state.onboarded=true;
      initProfile();state.profile.since=state.profile.since||TODAY;applyTheme();
      save();if(!$("onboard").hidden)closeOnboard();closeSheet();go("wallet");toast(`Restored ${s.wallet.length} card${s.wallet.length===1?"":"s"}`,()=>{const b=JSON.parse(before);Object.keys(state).forEach(k=>delete state[k]);Object.assign(state,b);save();render()});
    }catch{toast("That file isn't a Lucro backup")}};
  r.readAsText(file);
}
function openBackup(back){
  openSheet(`<h2 class="sheet-title">Back up your wallet</h2>
    <p class="sheet-sub">Your cards are saved on this phone. Save a backup file to iCloud Drive or Google Drive so you can restore them if you delete the app or get a new phone.</p>
    <button class="btn" onclick="exportWallet()">${ic("copy")} Save backup file</button>
    <label class="btn-outline restore-btn">Restore from a backup<input type="file" accept="application/json,.json" hidden onchange="importWallet(this.files[0])"></label>
    <p class="hint">${state.backedUp?`Last backup: ${shortDate(isoToDate(state.backedUp))}.`:"No backup yet."} Backups include your cards, picks, favorites and reports. Never card numbers.</p>`,false,back);
}

/* ─── Profile (avatar, top right): name, preferences, your data, about ─── */
const avatar=lg=>{const nm=myName();return `<span class="avatar ${lg?"lg":""}">${nm?esc(nm[0].toUpperCase()):ic("user")}</span>`};
const PROFILE_BACK={label:"Profile",fn:()=>openProfile()};
let profEditing=false;
function openProfile(keep){
  const pr=state.profile,nm=(pr.name||"").trim();
  const looks=Object.values(state.usage).reduce((a,b)=>a+(+b||0),0);
  const since=pr.since?isoToDate(pr.since).toLocaleDateString("en-US",{month:"long",year:"numeric"}):"";
  const d=CATALOG.updated?shortDate(isoToDate(CATALOG.updated)):"";
  const row=(icon,title,sub,fn,cls="")=>`<${fn?`button onclick="${fn}"`:"div"} class="row ${fn?"":"static"} ${cls}"><span class="row-ic">${ic(icon)}</span><span class="row-main"><span class="row-title">${title}</span>${sub?`<span class="row-sub">${sub}</span>`:""}</span>${fn&&!cls?ic("chevR","dim"):""}</${fn?"button":"div"}>`;
  const seg=["system","light","dark"].map(t=>`<button role="radio" aria-checked="${pr.theme===t}" class="${pr.theme===t?"on":""}" onclick="setTheme('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join("");
  const splashOn=pr.splash!==false;
  openSheet(`<div class="prof-head">${avatar(true)}
      ${profEditing?`<div class="rename-inline"><input class="field" id="prof-name" value="${esc(nm)}" placeholder="First name" maxlength="30" autocomplete="given-name" autocapitalize="words"
          onkeydown="if(event.key==='Enter')saveProfName();if(event.key==='Escape')cancelProfName()">
          <button class="icon-btn ok" onclick="saveProfName()" aria-label="Save name">${ic("check")}</button>
          <button class="icon-btn" onclick="cancelProfName()" aria-label="Cancel">${ic("x")}</button></div>`
        :`<h2 class="sheet-title title-edit"><span class="${nm?"":"dim"}">${nm?esc(nm):"Add your name"}</span><button class="pencil" onclick="startProfName()" aria-label="Edit name">${ic("edit")}</button></h2>`}
      ${since?`<p class="sheet-sub">Using Lucro since ${since}</p>`:""}</div>
    <div class="w-stats prof-stats">
      <button class="w-stat" onclick="closeSheet();go('wallet')"><b>${activeWallet().length}</b><span>Cards</span></button>
      <div class="w-stat"><b>${looks}</b><span>Lookups</span></div>
      <button class="w-stat" onclick="closeSheet();go('pay')"><b>${state.favs.length}</b><span>Favorites</span></button>
    </div>
    <h3 class="prof-sec">Preferences</h3>
    <div class="list">
      <div class="prof-pref"><span class="row-ic">${ic("sun")}</span><span class="row-title">Appearance</span><div class="seg" role="radiogroup" aria-label="Appearance">${seg}</div></div>
      <button class="toggle-row" role="switch" aria-checked="${splashOn}" onclick="toggleSplashPref()"><span class="prof-toggle-l"><span class="row-ic">${ic("bolt")}</span>Opening animation</span><span class="switch ${splashOn?"on":""}"></span></button>
    </div>
    <h3 class="prof-sec">Your data</h3>
    <div class="list">
      ${row("download","Back up or restore",state.backedUp?`Last backup ${shortDate(isoToDate(state.backedUp))}`:"No backup yet","openBackup(PROFILE_BACK)")}
      ${row("lock","Private by design","Your cards stay on this phone. Lucro never asks for card numbers or bank logins.")}
      ${row("trash","Erase all data","","eraseAll()","danger-row")}
    </div>
    <h3 class="prof-sec">About</h3>
    <div class="list">
      ${row("share","Share Lucro","Send it to a friend","shareApp()")}
      ${FEEDBACK_EMAIL?row("mail","Send feedback","Ideas, bugs, a store in the wrong place","sendFeedback()"):""}
      ${row("info",`Lucro ${APP_VERSION}`,`${Object.keys(CATALOG.products).length} cards and ${stores().length} stores${d?`, updated ${d}`:""}`)}
    </div>`,keep);
  if(profEditing)setTimeout(()=>{const i=$("prof-name");if(i){i.focus();i.select()}},50);
}
function startProfName(){profEditing=true;openProfile(true)}
function cancelProfName(){profEditing=false;openProfile(true)}
function saveProfName(){const old=state.profile.name,v=$("prof-name").value;profEditing=false;setMyName(v);openProfile(true);render();
  const nm=myName();toast(nm?`Hi, ${nm}`:"Name removed",()=>{setMyName(old);render();if(!$("sheet").hidden)openProfile(true)})}
function editNameFromHero(){profEditing=true;openProfile()}
function setTheme(t){state.profile.theme=t;save();applyTheme();openProfile(true)}
function applyTheme(){
  const t=state.profile.theme,root=document.documentElement;
  if(t==="light"||t==="dark")root.dataset.theme=t;else delete root.dataset.theme;
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{
    const dark=t==="dark"||(t!=="light"&&m.media.includes("dark"));m.content=dark?"#0b1412":"#f3f6f2"});
}
function toggleSplashPref(){state.profile.splash=state.profile.splash===false;save();openProfile(true)}
function shareApp(){
  const url=location.origin+location.pathname.replace(/preview.html$/,""),data={title:"Lucro",text:"Lucro tells you which credit card to use for every purchase.",url};
  if(navigator.share)navigator.share(data).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast("Link copied"),()=>toast(url));
  else toast(url);
}
function sendFeedback(){location.href=`mailto:${FEEDBACK_EMAIL}?subject=${encodeURIComponent(`Lucro ${APP_VERSION} feedback`)}`}
function eraseAll(){
  confirmDialog("Erase all data?","This deletes your cards, picks, favorites and settings from this phone. Save a backup first if you might want them back.","Erase",()=>{
    try{localStorage.removeItem(KEY)}catch{}memStore={};location.reload();
  });
}

/* ─── One-finger navigation ─── */
document.addEventListener("click",e=>{if(swipeOpen&&!e.target.closest(".swipe-wrap"))closeSwipes()},true);
// The Pay answer slides up like the other pop-ups: swipe down (or sideways) to close it.
sheetGestures($("ans-panel"),closeAnswer,()=>closeAnswer);
$("answer").addEventListener("click",e=>{if(e.target===$("answer"))closeAnswer()});
// Swipe left/right anywhere on a main tab to move between Pay, Wallet and Updates.
(function(){const ORDER=["pay","wallet"];let x0,y0,ok=false;
  const main=document.querySelector("main");
  main.addEventListener("touchstart",e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;
    ok=e.touches.length===1&&x0>24&&x0<innerWidth-24&&!e.target.closest("input,textarea,.chips,.no-swipe,.swipe-wrap")},{passive:true});
  main.addEventListener("touchend",e=>{if(!ok)return;ok=false;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)<80||Math.abs(dx)<Math.abs(dy)*2)return;
    const i=ORDER.indexOf(tab)+(dx<0?1:-1);if(i>=0&&i<ORDER.length)go(ORDER[i]);},{passive:true});
})();

/* ─── Opening splash ─── */
(function(){const sp=$("splash");if(!sp)return;
  if(!SHOW.splash||state.profile.splash===false){sp.remove();return}
  const done=()=>sp.remove();
  sp.addEventListener("animationend",e=>{if(e.target===sp)done()});
  sp.addEventListener("click",()=>sp.classList.add("skip"));
  setTimeout(done,2600); // safety net
})();

/* Ask the browser to keep this app's storage (protects the wallet from automatic clean-up) */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}

/* ─── Init ─── */
applyTheme();
if(!state.profile.since&&(state.onboarded||state.wallet.length)){state.profile.since=TODAY;save()}
go("pay");
if(!state.wallet.length&&!state.onboarded)openOnboard();
syncCatalog();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>
</body>
