<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Card Max">
<meta name="theme-color" content="#0f172a">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;min-height:100dvh;background:#0f172a;color:#e2e8f0;font-family:'DM Sans','Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
input::placeholder{color:#64748b}
input:focus{outline:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes altSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes drawerUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

.header{background:#0f172a;padding:16px 16px 0;position:sticky;top:0;z-index:100;border-bottom:1px solid #1e293b;padding-top:env(safe-area-inset-top,16px)}
.tabs{display:flex;background:#1e293b;border-radius:10px;padding:3px}
.tab{flex:1;text-align:center;padding:10px 4px;border-radius:8px;cursor:pointer;transition:all .12s ease;user-select:none;font-size:13px;font-weight:600;color:#64748b}
.tab.active{background:#334155;color:#fff}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 10px 80px}
.tile{background:#1e293b;border-radius:14px;padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;min-height:90px;border:1px solid #1e293b;transition:background .1s}
.tile:active{background:#334155}

.overlay{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;animation:fadeIn .12s ease;overflow-y:auto}
.back-btn{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.12);color:#e2e8f0;font-size:15px;font-weight:600;padding:12px 36px;border-radius:12px;cursor:pointer;user-select:none;border:1px solid rgba(255,255,255,.15)}
.back-btn:active{background:rgba(255,255,255,.2)}

.drawer-bg{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .12s ease}
.drawer{background:#1e293b;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px 20px 32px;animation:drawerUp .2s ease}

.search-input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:15px;font-family:inherit}
.search-input:focus{border-color:#059669}

.card-row{background:#1e293b;border-radius:14px;padding:14px 16px;margin-bottom:6px;cursor:pointer;user-select:none;border:1px solid #334155;display:flex;align-items:center;gap:12px;transition:background .1s}
.card-row:active{background:#334155}

.hidden{display:none}
.mono{font-family:‘JetBrains Mono’,monospace}
</style>

</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
    <div style="width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#16a34a,#059669);display:flex;align-items:center;justify-content:center;font-size:17px">💳</div>
    <div style="flex:1">

    </div>
  </div>
  <div class="tabs">
    <div class="tab active" id="tab-quick" onclick="switchTab('quick')">⚡ Quick</div>
    <div class="tab" id="tab-cards" onclick="switchTab('cards')">💳 My Cards</div>
    <div class="tab" id="tab-full" onclick="switchTab('full')">📋 Categories</div>

</div>

<div id="overlay" class="overlay hidden"></div>

/* ─── HELPERS ─── */
function pctColor(p){return p>=5?"#16a34a":p>=4?"#059669":p>=3?"#0284c7":p>=2?"#6366f1":"#94a3b8"}

function answerGrad(p){return p>=5?"linear-gradient(145deg,#14532d,#052e16)":p>=3?"linear-gradient(145deg,#0c4a6e,#082f49)":"linear-gradient(145deg,#1e293b,#0f172a)"}
function answerAccent(p){return p>=5?"#4ade80":p>=3?"#38bdf8":"#94a3b8"}
function badgeHTML(o,sz){

    if(o==="G")return`<span style="font-size:9px;font-weight:700;background:#fef3c7;color:#92400e;padding:1px 4px;border-radius:3px;margin-left:6px">G</span>`;

  }
  return"";
}
function findKey(last4){for(const[k,c]of Object.entries(CARD_DB))if(c.last4===last4)return k;return null}

function switchTab(t){
  currentTab=t;

  document.getElementById("tab-cards").className=t==="cards"?"tab active":"tab";
  document.getElementById("tab-full").className=t==="full"?"tab active":"tab";
  document.getElementById("quick-view").className=t==="quick"?"":"hidden";
  document.getElementById("cards-view").className=t==="cards"?"":"hidden";
  document.getElementById("full-view").className=t==="full"?"":"hidden";
  document.getElementById("subtitle").textContent=subtitles[t];
  if(t==="cards")buildMyCards();
  if(t==="full")buildFullView();
}

/* ─── QUICK TAP GRID ─── */
function buildGrid(){
  document.getElementById("grid").innerHTML=sorted.map(c=>`
    <div class="tile" onclick="showAnswer('${c.id}')">
      <div style="font-size:34px;line-height:1;margin-bottom:6px">${c.emoji}</div>
      <div style="font-size:14px;font-weight:600;color:#e2e8f0;text-align:center;line-height:1.2">${c.label}</div>
    </div>`).join("");
}

/* ─── ANSWER OVERLAY ─── */
function showAnswer(id){

  const best=cat.cards[0],alts=cat.cards.slice(1);
  const accent=answerAccent(best.pct),bestKey=findKey(best.last4);
  const o=document.getElementById("overlay");
  o.className="overlay";o.style.background=answerGrad(best.pct);
  o.innerHTML=`
    <div style="font-size:16px;font-weight:600;color:${accent};opacity:.7;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px">${cat.emoji} ${cat.label}</div>
    <div class="mono" style="font-size:80px;font-weight:700;color:${accent};line-height:1;letter-spacing:-0.04em;animation:popIn .15s ease">${best.pct>0?best.pct+"%":"0%"}</div>
    ${best.pct===0?`<div style="font-size:18px;color:${accent};font-weight:600;margin-top:4px">APR — carry balance</div>`:""}
    <div onclick="event.stopPropagation();showDrawer('${bestKey}')" style="font-size:28px;font-weight:700;color:#fff;margin-top:16px;text-align:center;line-height:1.2;text-decoration:underline;text-decoration-color:rgba(255,255,255,.2);text-underline-offset:3px;cursor:pointer">${best.name}</div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
      <span class="mono" style="font-size:22px;color:#cbd5e1;font-weight:500;letter-spacing:.08em">•••• ${best.last4}</span>
      ${badgeHTML(best.owner)}
    </div>
    ${best.note?`<div style="font-size:13px;color:#94a3b8;margin-top:10px;background:rgba(255,255,255,.05);padding:5px 12px;border-radius:8px">${best.note}</div>`:""}
    ${alts.length?`<div style="margin-top:24px;width:100%;max-width:340px">
      <div style="font-size:12px;color:#64748b;text-transform:uppercase;font-weight:600;letter-spacing:.05em;margin-bottom:8px;text-align:center">Alternatives</div>
      ${alts.map((c,i)=>{const k=findKey(c.last4);return`
        <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.1);margin-bottom:3px;animation:altSlide .12s ease ${i*.04}s both">
          <span style="font-size:13px;flex:1;color:#f1f5f9;font-weight:500;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(255,255,255,.2);text-underline-offset:2px" onclick="event.stopPropagation();showDrawer('${k}')">${c.name}</span>
          <span style="font-size:12px;color:#94a3b8">••${c.last4}</span>
          ${badgeHTML(c.owner,"sm")}
          <span class="mono" style="font-size:13px;font-weight:600;color:#f1f5f9">${c.pct>0?c.pct+"%":"0%APR"}</span>
        </div>`}).join("")}
    </div>`:""}
    <div class="back-btn" onclick="hideAnswer()">← Back to grid</div>`;
}
function hideAnswer(){document.getElementById("overlay").className="overlay hidden"}

/* ─── CARD DRAWER ─── */
let drawerEditing=false;
function showDrawer(key){
  if(!key)return;
  const card=CARD_DB[key];if(!card)return;
  drawerEditing=false;
  const d=document.getElementById("drawer");
  d.className="drawer-bg";
  d.onclick=function(e){if(e.target===d)hideDrawer()};
  const rewards=getRewards(key);
  d.innerHTML=`<div class="drawer" onclick="event.stopPropagation()">
    <div style="width:36px;height:4px;border-radius:2px;background:#475569;margin:0 auto 16px"></div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#334155,#1e293b);border:1px solid #475569;display:flex;align-items:center;justify-content:center;font-size:20px">💳</div>
      <div style="flex:1">
        <div style="font-size:18px;font-weight:700;color:#f1f5f9">${card.name} ${badgeHTML(card.owner,"sm")}</div>
        <div class="mono" style="font-size:13px;color:#94a3b8;margin-top:2px">•••• ${card.last4}</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:20px">
      <div style="flex:1;background:#0f172a;border-radius:10px;padding:8px 6px;text-align:center">
        <div style="font-size:10px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.05em">Due</div>
        <div style="font-size:13px;font-weight:700;color:#e2e8f0;margin-top:2px">${card.dueDate}</div>
      </div>
      <div style="flex:1;background:#0f172a;border-radius:10px;padding:8px 6px;text-align:center">
        <div style="font-size:10px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.05em">Limit</div>
        <div style="font-size:13px;font-weight:700;color:#e2e8f0;margin-top:2px">${card.limit}</div>
      </div>
      <div style="flex:1;background:#0f172a;border-radius:10px;padding:8px 6px;text-align:center">
        <div style="font-size:10px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.05em">Fee</div>
        <div style="font-size:13px;font-weight:700;color:#e2e8f0;margin-top:2px">${card.annualFee}</div>
      </div>
      <div id="rewards-box" onclick="startEditRewards('${key}')" style="flex:1;background:#0f172a;border:1px solid transparent;border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer">
        <div style="font-size:10px;color:#16a34a;font-weight:600;text-transform:uppercase;letter-spacing:.05em">REWARDS ✎</div>
        <div id="rewards-display" class="mono" style="font-size:13px;font-weight:700;color:#4ade80;margin-top:2px">${rewards}</div>
      </div>
    </div>
    <div style="margin-bottom:20px">
      <div style="font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Reward Tiers</div>
      ${card.tiers.map((t,i)=>`
        <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;background:${i===0?"#132216":"#0f172a"};border:1px solid ${i===0?"#16a34a33":"transparent"};margin-bottom:4px">
          <div class="mono" style="font-size:15px;font-weight:700;color:${pctColor(t.pct)};min-width:38px;text-align:right;flex-shrink:0">${t.pct}%</div>
          <div style="flex:1">
            <div style="font-size:14px;font-weight:600;color:#e2e8f0">${t.cat}</div>
            ${t.cap?`<div style="font-size:11px;color:#94a3b8;margin-top:2px">${t.cap}</div>`:""}
          </div>
        </div>`).join("")}
    </div>
    ${card.perks.length?`<div>
      <div style="font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Notes & Perks</div>
      ${card.perks.map(p=>`<div style="padding:8px 12px;border-radius:8px;background:#0f172a;margin-bottom:3px;font-size:13px;color:#cbd5e1;line-height:1.4">${p}</div>`).join("")}
    </div>`:""}
    <div onclick="hideDrawer()" style="margin-top:20px;text-align:center;background:rgba(255,255,255,.08);color:#94a3b8;font-size:14px;font-weight:600;padding:12px;border-radius:12px;cursor:pointer;border:1px solid rgba(255,255,255,.1)">Done</div>
  </div>`;
}
function hideDrawer(){document.getElementById("drawer").className="hidden";if(currentTab==="cards")buildMyCards()}
function startEditRewards(key){
  if(drawerEditing)return;drawerEditing=true;
  const box=document.getElementById("rewards-box");
  const cur=getRewards(key);
  box.style.background="#132216";box.style.borderColor="#16a34a55";box.onclick=null;
  box.innerHTML=`<div style="font-size:10px;color:#16a34a;font-weight:600;text-transform:uppercase;letter-spacing:.05em">EDITING</div>
    <input id="rewards-input" value="${cur}" style="width:100%;max-width:70px;background:transparent;border:none;border-bottom:1px solid #16a34a;color:#4ade80;font-size:13px;font-weight:700;text-align:center;outline:none;font-family:'JetBrains Mono',monospace;margin-top:2px"
      onblur="saveRewards('${key}')" onkeydown="if(event.key==='Enter')saveRewards('${key}')">`;
  document.getElementById("rewards-input").focus();
}
function saveRewards(key){
  const inp=document.getElementById("rewards-input");if(!inp)return;
  setRewards(key,inp.value);drawerEditing=false;
  const box=document.getElementById("rewards-box");
  box.style.background="#0f172a";box.style.borderColor="transparent";
  box.onclick=function(){startEditRewards(key)};
  box.innerHTML=`<div style="font-size:10px;color:#16a34a;font-weight:600;text-transform:uppercase;letter-spacing:.05em">REWARDS ✎</div>
    <div class="mono" style="font-size:13px;font-weight:700;color:#4ade80;margin-top:2px">${getRewards(key)}</div>`;
}

/* ─── MY CARDS VIEW ─── */
function buildMyCards(filter){
  const q=(filter||"").toLowerCase();
  const all=Object.entries(CARD_DB).map(([k,c])=>({key:k,...c}));
  const list=q?all.filter(c=>c.name.toLowerCase().includes(q)||c.last4.includes(q)||c.tiers.some(t=>t.cat.toLowerCase().includes(q))):all;
  const G=list.filter(c=>c.owner==="G"),M=list.filter(c=>c.owner==="M");

  const renderCard=c=>{
    const rw=getRewards(c.key);
    return`<div class="card-row" onclick="showDrawer('${c.key}')">
      <div style="flex:1;min-width:0">
        <div style="font-size:16px;font-weight:700;color:#f1f5f9">${c.name}</div>
        <div class="mono" style="font-size:12px;color:#64748b;margin-top:2px">•••• ${c.last4}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div class="mono" style="font-size:12px;color:#4ade80;font-weight:600">${rw}</div>
        <div style="font-size:11px;color:#475569;margin-top:2px">Due: ${c.dueDate} · ${c.limit}</div>
      </div>
    </div>`;
  };

  const v=document.getElementById("cards-view");
  v.innerHTML=`
    <div style="padding:12px 14px 6px">
      <input class="search-input" type="text" placeholder="Search cards, categories..." oninput="buildMyCards(this.value)" ${q?`value="${q}"`:""}>
    </div>
    <div style="padding:8px 12px 80px">
      ${G.length?`<div style="font-size:12px;font-weight:700;color:#92400e;background:#fef3c7;display:inline-block;padding:3px 10px;border-radius:6px;margin-bottom:8px;letter-spacing:.04em">GABBY'S CARDS</div>${G.map(renderCard).join("")}<div style="height:16px"></div>`:""}
      ${M.length?`<div style="font-size:12px;font-weight:700;color:#5b21b6;background:#ede9fe;display:inline-block;padding:3px 10px;border-radius:6px;margin-bottom:8px;letter-spacing:.04em">MATT'S CARDS</div>${M.map(renderCard).join("")}`:""}
      ${list.length===0?`<div style="text-align:center;padding:40px;color:#475569">No matching cards</div>`:""}
    </div>`;
}

/* ─── FULL VIEW ─── */
let expandedId=null;
function buildFullView(filter){
  const q=(filter||"").toLowerCase();
  const cats=q?CATEGORIES.filter(c=>c.label.toLowerCase().includes(q)||c.cards.some(d=>d.name.toLowerCase().includes(q))):CATEGORIES;

  const v=document.getElementById("full-view");
  v.innerHTML=`
    <div style="padding:12px 14px 6px">
      <input class="search-input" type="text" placeholder="Search category or card..." oninput="filterFull(this.value)" ${q?`value="${q}"`:""}>
    </div>
    <div style="padding:4px 12px 80px" id="full-list">
      ${cats.map(cat=>{
        const isOpen=expandedId===cat.id,best=cat.cards[0];
        let cards="";
        if(isOpen){
          cards=`<div style="padding:4px 8px 8px">${cat.cards.map((c,i)=>{
            const k=findKey(c.last4);
            return`<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:${i===0?"#132216":"#1e293b"};border:1px solid ${i===0?"#16a34a33":"transparent"};margin-bottom:4px;animation:slideIn .15s ease ${i*.04}s both">
              <div style="width:22px;height:22px;border-radius:6px;background:${i===0?"#16a34a":"#334155"};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:${i===0?"#fff":"#94a3b8"};flex-shrink:0">${i===0?"★":i+1}</div>
              <div style="flex:1;min-width:0">
                <div style="display:flex;align-items:center;gap:6px">
                  <span onclick="event.stopPropagation();showDrawer('${k}')" style="font-size:14px;font-weight:600;color:${i===0?"#4ade80":"#e2e8f0"};text-decoration:underline;text-decoration-color:rgba(255,255,255,.2);text-underline-offset:3px;cursor:pointer">${c.name}</span>
                  ${badgeHTML(c.owner,"sm")}
                </div>
                <div style="font-size:12px;color:#64748b;margin-top:1px">•••${c.last4}${c.note?" · "+c.note:""}</div>
              </div>
              <div class="mono" style="font-weight:600;font-size:${i===0?16:14}px;color:${pctColor(c.pct)};flex-shrink:0">${c.pct>0?c.pct+"%":"0%APR"}</div>
            </div>`}).join("")}</div>`;
        }
        return`<div style="margin-bottom:4px">
          <div onclick="toggleFull('${cat.id}')" style="display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:${isOpen?"#1e293b":"transparent"};cursor:pointer;user-select:none">
            <div style="font-size:22px;width:32px;text-align:center;flex-shrink:0">${cat.emoji}</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:15px;font-weight:600">${cat.label}</div>
              <div style="font-size:12px;color:#94a3b8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${best.name} •••${best.last4}</div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
              ${best.pct>0?`<div class="mono" style="background:${pctBg(best.pct)};color:${pctColor(best.pct)};font-weight:600;font-size:14px;padding:3px 8px;border-radius:7px">${best.pct}%</div>`:""}
              <div style="color:#475569;font-size:12px;transform:rotate(${isOpen?180:0}deg);transition:transform .15s ease">▼</div>
            </div>
          </div>
          ${cards}
        </div>`;
      }).join("")}
      ${cats.length===0?`<div style="text-align:center;padding:40px;color:#475569">No matching categories</div>`:""}
    </div>`;
}
function toggleFull(id){expandedId=expandedId===id?null:id;buildFullView(document.querySelector("#full-view .search-input")?.value)}
function filterFull(v){expandedId=null;buildFullView(v)}

/* ─── INIT ─── */
buildGrid();

/* ─── SERVICE WORKER ─── */
if("serviceWorker"in navigator){
  const sw=`const C='card-max-v2';self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll(['./']))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:"application/javascript"}))).catch(()=>{});
}
</script>
