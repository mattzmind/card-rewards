<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Card Max">
<meta name="theme-color" content="#f4f6f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b100e" media="(prefers-color-scheme: dark)">
<title>Card Maximizer</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-thumb phone app. Large title on top, content in the middle, tab bar pinned to the bottom. */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --surface-2:#eef2f0; --ink:#0f1a16; --muted:#5c6b64; --line:#dfe6e2;
  --accent:#0f766e; --on-accent:#ffffff; --rate:#047857; --warn:#8a5200; --star:#d97706; --warn-bg:#fdf1dc; --info:#1d4f91; --info-bg:#e7f0fb;
  --danger:#b42318; --scrim:rgba(8,14,12,.45); --shadow:0 1px 2px rgba(15,26,22,.05),0 10px 30px rgba(15,26,22,.08);
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --tabbar:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b100e; --surface:#141b18; --surface-2:#1c2521; --ink:#e8efec; --muted:#97a69f; --line:#26312d;
  --accent:#2dd4bf; --on-accent:#032420; --rate:#4ade80; --warn:#fbbf24; --star:#fbbf24; --warn-bg:#2f250f; --info:#9cc7fb; --info-bg:#14243a;
  --danger:#f87171; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b100e; --surface:#141b18; --surface-2:#1c2521; --ink:#e8efec; --muted:#97a69f; --line:#26312d;
  --accent:#2dd4bf; --on-accent:#032420; --rate:#4ade80; --warn:#fbbf24; --star:#fbbf24; --warn-bg:#2f250f; --info:#9cc7fb; --info-bg:#14243a;
  --danger:#f87171; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 16px)}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--muted)}
.ic{width:22px;height:22px;flex-shrink:0}
.ic.dim{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* app bar */
.appbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.appbar h1{font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:-.02em}
.btn-pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px}
.btn-pill .ic{width:18px;height:18px}
.view{padding:0 16px}

/* search */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--accent)}
.search .ic{color:var(--muted)}
.search input{flex:1;min-width:0;border:none;background:transparent;font-size:17px;padding:14px 0;outline:none}
.search input::placeholder{color:var(--muted)}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.clear{color:var(--muted);padding:6px}

/* sections, tiles, chips, lists */
.sec{font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:24px 2px 10px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:92px;justify-content:center;text-align:center}
.tile .ic{width:28px;height:28px;color:var(--accent)}
.tile span{font-size:14px;font-weight:600;line-height:1.2}
.tile:active,.row:active,.chip:active,.card-row:active{background:var(--surface-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500}
.chip .ic{width:16px;height:16px;color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.on .ic{color:var(--on-accent)}
.more{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:16px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-weight:600}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row,.card-row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-top:1px solid var(--line)}
.list>:first-child{border-top:none}
.row-ic{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent);flex-shrink:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--muted)}
.row.muted,.offer.muted{opacity:.6}
.last4{font-size:14px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:8px;vertical-align:middle}
.hint{font-size:13px;color:var(--muted);margin:10px 2px}
.empty{text-align:center;padding:48px 16px;max-width:360px;margin:0 auto}
.empty h2{font-family:var(--display);font-size:22px;margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:20px}
.empty-ic{width:56px;height:56px;border-radius:50%;background:var(--surface-2);color:var(--rate);display:grid;place-items:center;margin:0 auto 14px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:24px 0 8px;line-height:1.6}
.stack{display:flex;flex-direction:column;gap:10px}

/* buttons */
.btn{display:block;width:100%;text-align:center;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;padding:14px;border-radius:14px;margin-top:12px}
.btn:disabled{background:var(--surface-2);color:var(--muted);cursor:default}
.btn-ghost{display:block;width:100%;text-align:center;color:var(--muted);font-weight:600;padding:14px;margin-top:6px}
.btn-danger{display:block;width:100%;text-align:center;color:var(--danger);font-weight:600;padding:12px}
.btn-sm{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;white-space:nowrap}
.btn-sm .ic{width:16px;height:16px}
.btn-sm.alt{background:var(--surface-2);color:var(--ink)}
.btn-sm:disabled{opacity:.7;cursor:default}
.btn-row{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.btn-quiet{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);padding:8px 12px;border-radius:10px;background:var(--surface-2)}
.btn-quiet .ic{width:17px;height:17px}
.link{display:block;margin:10px auto 0;color:var(--accent);font-weight:600;font-size:14px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:600;padding:6px 0}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:12px;font-weight:600;position:relative}
.tabbar button.on{color:var(--accent)}
.tabbar .ic{width:24px;height:24px}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:var(--bg);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* answer screen */
.answer{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;animation:fade .15s ease}
.ans-inner{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px calc(env(safe-area-inset-bottom,0px) + 32px)}
.ans-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px}
.ans-where{font-weight:600;text-align:center;max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ans-ctx{text-align:center;color:var(--muted);margin:6px 0 16px}
.ans-ctx b{color:var(--ink);font-weight:600}
.ans-card{max-width:320px;margin:0 auto;cursor:pointer}
.ans-name{text-align:center;font-weight:600;font-size:18px;margin-top:16px}
.ans-name .mono{color:var(--muted);font-weight:500;margin-left:4px}
.ans-rate{text-align:center;font-size:72px;font-weight:600;line-height:1;color:var(--rate);letter-spacing:-.03em;margin-top:10px}
.ans-dollars{text-align:center;color:var(--muted);margin-top:6px}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.pill{font-size:13px;padding:5px 10px;border-radius:8px;background:var(--surface-2);color:var(--ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--info-bg);color:var(--info)}
.ans-actions{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.ans-none{text-align:center;padding:40px 8px}
.ans-none h2{font-family:var(--display);font-size:22px;margin-bottom:8px}
.ans-none p{color:var(--muted)}
.alt-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-top:1px solid var(--line)}
.alt-row.dashed{border:1px dashed var(--line);border-radius:12px;margin-top:6px}
.list .alt-row.dashed{border:none;border-top:1px dashed var(--line);border-radius:0;margin:0}
.alt-main{flex:1;min-width:0;display:flex;flex-direction:column}
.alt-name{font-weight:600}
.alt-sub{font-size:13px;color:var(--muted)}
.alt-rate{font-weight:600;font-size:16px}
.why{display:flex;align-items:center;gap:8px;width:100%;margin-top:20px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-weight:600}
.why .ic:first-child{color:var(--accent)}
.why .ic:last-child{margin-left:auto}
.why-body{padding:12px 4px 0;font-size:15px;display:flex;flex-direction:column;gap:8px}
.why-body .dim{font-size:13px}

/* card art placeholder */
.art{position:relative;display:block;width:100%;aspect-ratio:1.586;max-width:100%;border-radius:14px;overflow:hidden;color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.14)}
.art.mini{display:inline-block;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);flex-shrink:0}
.art-band{position:absolute;inset:0;background:radial-gradient(circle at 85% 18%,rgba(255,255,255,.22),transparent 42%),linear-gradient(120deg,transparent 52%,rgba(255,255,255,.1) 52%,rgba(255,255,255,.1) 70%,transparent 70%)}
.art-iss{position:absolute;top:9%;left:7%;font-family:var(--display);font-weight:700;font-size:16px}
.art-chip{position:absolute;left:7%;top:38%;width:15%;aspect-ratio:1.3;border-radius:18%;background:linear-gradient(135deg,#fde68a,#d4a017 55%,#fcd34d)}
.art.mini .art-chip{top:30%;left:10%;width:26%}
.art-name{position:absolute;left:7%;bottom:9%;right:30%;font-size:15px;font-weight:600;line-height:1.15}
.art-net{position:absolute;right:7%;bottom:9%;font-size:13px;font-weight:700;opacity:.9}


/* favorites */
.sec-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-row .sec{margin-bottom:10px}
.link-btn{color:var(--accent);font-weight:600;font-size:14px;padding:6px 2px}
.tile{position:relative}
.tile .fav-dot{position:absolute;top:8px;right:8px;width:14px;height:14px;color:var(--star)}
.tile .fav-dot .ic{width:14px;height:14px;fill:currentColor}
.star-btn{justify-self:end;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.star-btn.on{color:var(--star)}
.star-btn.on .ic{fill:currentColor}
.fav-row .ic.star{width:24px;height:24px;color:var(--muted)}
.fav-row.on .ic.star{color:var(--star);fill:currentColor}
.fav-count{color:var(--muted);font-size:14px;margin:-6px 0 12px}
/* sheet header: close + floating back bubble */
.sheet{position:relative;overscroll-behavior:contain;touch-action:pan-y;transition:none}
.sheet.dragging{transition:none}
.sheet.settle{transition:transform .2s ease}
.sheet-top{position:sticky;top:0;z-index:5;height:44px;margin:-4px -8px 6px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.sheet-top>*{pointer-events:auto}
.sheet-top .handle{position:absolute;left:50%;top:0;transform:translateX(-50%);margin:0}
.bubble{display:inline-flex;align-items:center;gap:4px;height:38px;min-width:38px;padding:0 12px 0 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.14);font-weight:600;font-size:15px;color:var(--accent)}
.bubble.close{padding:0;justify-content:center;color:var(--ink);margin-left:auto}
.bubble .ic{width:20px;height:20px}
/* sheets */
.sheet-bg{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .12s ease}
.sheet{background:var(--bg);border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:12px 18px calc(env(safe-area-inset-bottom,0px) + 22px);animation:rise .2s ease}
.sheet.still{animation:none}
.handle{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet-title{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em}
.sheet-title.center,.center{text-align:center}
.sheet-sub{color:var(--muted);margin:4px 0 14px}
.drawer-head{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.drawer-head .sheet-sub{margin:2px 0 6px;font-size:14px}
.tiers{display:flex;flex-direction:column;gap:6px}
.tier{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.tier.top{border-color:var(--accent)}
.tier-rate{min-width:48px;text-align:right;font-weight:600;color:var(--rate)}
.notes{padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.flabel{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:16px 2px 8px}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.field:focus{outline:none;border-color:var(--accent)}
.source{font-size:12px;color:var(--muted);margin-top:20px;line-height:1.6}
.source a{color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;font-size:13px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:11px;color:var(--muted)}
.offers{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.offer{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.offer-art{max-width:260px;margin:0 auto 14px}
.offer-art.small{max-width:200px;margin:8px auto 12px}
.radio-list{display:flex;flex-direction:column;gap:8px}
.radio{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.radio input{accent-color:var(--accent);width:18px;height:18px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.task-head{display:flex;align-items:center;gap:10px}
.task-text{font-weight:600;margin-top:10px}
.task-sub{font-size:13px;color:var(--muted);margin-top:2px}
.task-btns{display:flex;gap:8px;margin-top:12px}

/* onboarding */
.onboard{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto;animation:fade .15s ease}
.ob-inner{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 120px}
.ob-inner h1{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.ob-inner>p{color:var(--muted);margin:8px 0 16px}
.ob-grid .art-name{display:none}
.ob-grid .art-iss{font-size:14px}
.ob-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.ob-card{position:relative;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;border:2px solid transparent;background:var(--surface)}
.ob-card.on{border-color:var(--accent)}
.ob-card:disabled{opacity:.5}
.ob-name{font-size:13px;font-weight:600;line-height:1.25}
.ob-check{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.ob-check .ic{width:18px;height:18px}
.ob-owned{font-size:12px;color:var(--muted)}
.ob-bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.ob-bar-in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.ob-bar .btn{margin:0;flex:1}
.ob-bar .btn-ghost{margin:0;width:auto;padding:14px 8px}

/* toast */
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 12px);z-index:60;max-width:480px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:14px;animation:fade .15s ease}
.toast button{color:var(--bg);font-weight:700;text-decoration:underline}
</style>
</head>
<body>
<header class="appbar"><h1 id="title">Pay</h1><div id="appbar-action"></div></header>

<main>
  <section id="view-pay" class="view">
    <div id="pay-empty" class="empty" hidden><h2>Add your cards to start</h2><p>Tell the app which cards you carry. It ranks them for every purchase.</p><button class="btn" onclick="openOnboard()">Pick your cards</button></div>
    <div id="pay-main">
      <label class="search" for="q"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Where are you paying?" autocomplete="off" oninput="onPaySearch(this.value)" aria-label="Search stores or categories">
        <button id="q-clear" class="clear" hidden onclick="clearPaySearch()" aria-label="Clear search"><svg class="ic dim" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </label>
      <div id="pay-results" hidden></div>
      <div id="pay-home">
        <div id="recents"></div>
        <div class="sec-row"><h2 class="sec" id="top-title">Your top spots</h2><button class="link-btn" onclick="openFavs()" id="fav-edit">Pick favorites</button></div>
        <div id="top" class="tiles"></div>
        <button id="more-btn" class="more" onclick="toggleMore()">More categories</button>
        <div id="all" class="tiles" style="margin-top:10px" hidden></div>
      </div>
    </div>
  </section>

const NOW=new Date();
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const TODAY=iso(NOW);
const qKey=d=>d.getFullYear()+"-Q"+(Math.floor(d.getMonth()/3)+1);
const QK=qKey(NOW);
const NQK=(()=>{const q=Math.floor(NOW.getMonth()/3)+1;return q===4?(NOW.getFullYear()+1)+"-Q1":NOW.getFullYear()+"-Q"+(q+1)})();
const qLabel=k=>{const[y,q]=k.split("-");return q+" "+y};
const qEnd=k=>{const[y,q]=k.split("-Q").map(Number);return new Date(y,q*3,0)};
const qStart=k=>{const[y,q]=k.split("-Q").map(Number);return new Date(y,(q-1)*3,1)};
const qDeadline=(k,day)=>{const[y,q]=k.split("-Q").map(Number);return new Date(y,q*3-1,day)};
const daysLeftInQ=Math.round((qEnd(QK)-new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()))/864e5);
const PICK_Q=daysLeftInQ<=15?NQK:QK; // near quarter end, quarterly picks are for next quarter
const shortDate=d=>d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
const isoToDate=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const ordinal=n=>{if(!n)return"—";const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const unitOf=p=>p&&p.type!=="cash"?"x":"%";
const capWord=w=>w?w[0].toUpperCase()+w.slice(1):"";
const netLabel=n=>n==="store"?"Store card":capWord(n);
const netOf=w=>w.network||P(w.product)?.network;

/* choice-slot helpers: options are {id,label,cats} */
const optOf=(slot,id)=>(slot.options||[]).find(o=>o.id===id);
const selOpts=(w,slot)=>{const s=w.sel[slot.id];return s&&s.opts&&s.opts.length?s.opts:(slot.default?[slot.default]:[])};
const isDefaultSel=(w,slot)=>!(w.sel[slot.id]&&w.sel[slot.id].opts&&w.sel[slot.id].opts.length)&&!!slot.default;
const selCats=(w,slot)=>selOpts(w,slot).flatMap(id=>optOf(slot,id)?.cats||[]);
const selLabels=(w,slot)=>selOpts(w,slot).map(id=>optOf(slot,id)?.label||id);

/* ══════════════════════════════════════════════════════════
   6. RANKING ENGINE
   ══════════════════════════════════════════════════════════ */
function matches(cats,excl,cat){
  if(cats.includes(cat.id))return true;
  return !!(cat.parent&&cats.includes(cat.parent)&&!(excl||[]).includes(cat.id));
}
/* spending caps: period parsed from the rule's note ("$6,000/yr", "$1,500/quarter", "per billing cycle") */
function capPeriod(text){text=(text||"").toLowerCase();
  if(/billing cycle|\/mo\b|per month|a month|monthly/.test(text))return"month";
  if(/quarter|\/q\b/.test(text))return"quarter";
  if(/\/yr|year|annual/.test(text))return"year";return null}
function periodEnd(per){if(per==="month")return iso(new Date(NOW.getFullYear(),NOW.getMonth()+1,0));if(per==="quarter")return iso(qEnd(QK));return iso(new Date(NOW.getFullYear(),11,31))}
const isCapped=(w,key)=>!!(w.capped&&w.capped[key]&&w.capped[key]>=TODAY);
const storeHit=(r,store)=>!!(store&&r.m&&(r.m.includes(store.id)||(store.tags||[]).some(t=>r.m.includes(t))));

function evalCard(w,cat,store){
  const p=P(w.product);if(!p)return null;
  if(p.storeOnly&&!p.storeOnly.includes(cat.id))return null;
  if(cat.networks&&!cat.networks.includes(netOf(w)))return null;
  const bx=p.baseExcept&&p.baseExcept.cats.includes(cat.id)?p.baseExcept:null;
  let best={rate:bx?bx.rate:p.base,label:bx?bx.label:(p.baseLabel||"Everything else"),note:"",flags:[],cap:null};
  const take=(rate,label,note,flags,cap)=>{if(rate>best.rate)best={rate,label,note:note||"",flags:flags||[],cap:cap||null}};
  const conds=[];
  (p.rules||[]).forEach((r,i)=>{
    if(!matches(r.cats,r.excl,cat))return;
    if(r.cond&&!storeHit(r,store)){conds.push(r);return}
    const key="r"+i,per=capPeriod(r.note);
    if(per&&isCapped(w,key))return;
    take(r.rate,r.label,r.cond?`At ${store.name}`:r.note,[],per?{key,per,text:r.note}:null);
  });
  (p.choice||[]).forEach(slot=>{
    if(!matches(selCats(w,slot),null,cat))return;
    const key="c:"+slot.id,per=capPeriod(slot.note);
    if(per&&isCapped(w,key))return;
    const s=w.sel[slot.id];
    const stale=slot.period==="quarter"&&(!s||!s.quarter||s.quarter<QK);
    take(slot.rate,slot.label.replace("Your ","").replace(/^./,c=>c.toUpperCase()),slot.note,stale?["confirm"]:[],per?{key,per,text:slot.note}:null);
  });
  if(p.rotating&&!isCapped(w,"rot")){
    const q=p.rotating.schedule[QK],cap={key:"rot",per:"quarter",text:p.rotating.cap};
    if(q&&matches(q.cats,null,cat)){
      if(w.activated.includes(QK))take(p.rotating.rate,qLabel(QK)+" bonus",p.rotating.cap,[],cap);
      else if(p.rotating.retroactive&&qDeadline(QK,p.rotating.deadlineDay||31)>=NOW)
        take(p.rotating.rate,qLabel(QK)+" bonus",`Activate by ${shortDate(qDeadline(QK,p.rotating.deadlineDay))}`,["activate"],cap);
    }
  }
  if(p.auto&&w.autoFocus&&matches([w.autoFocus],null,cat)&&!isCapped(w,"auto"))
    take(p.auto.rate,"Top category this cycle",p.auto.note,[],{key:"auto",per:"month",text:p.auto.note});
  let rate=best.rate;const extras=[];
  w.promos.forEach(pr=>{if(pr.until>=TODAY){rate+=pr.extra;extras.push(pr)}});
  const mult=p.type==="cash"?1:(p.cpp||1),bump=extras.reduce((a,e)=>a+e.extra,0);
  rate=rate*mult;
  const special=conds.map(r=>({rate:Math.round((r.rate+bump)*mult*100)/100,label:r.label,cond:r.cond}))
    .filter(x=>x.rate>rate).sort((a,b)=>b.rate-a.rate)[0]||null;
  const apr=w.introApr&&w.introApr>=TODAY?w.introApr:null;
  return {w,p,rate:Math.round(rate*100)/100,label:best.label,note:best.note,flags:best.flags,cap:best.cap,extras,apr,special};
}
function rank(cat,store){
  return state.wallet.map(w=>evalCard(w,cat,store)).filter(Boolean)
    .sort((a,b)=>b.rate-a.rate||a.flags.length-b.flags.length);
}
function networkHidden(cat){
  if(!cat.networks)return 0;
  return state.wallet.filter(w=>{const p=P(w.product);return p&&!p.storeOnly&&!cat.networks.includes(netOf(w))}).length;
}
/* does any wallet card name this category directly (not via parent)? */
function directHit(cat){
  return state.wallet.some(w=>{
    const p=P(w.product);if(!p)return false;
    if((p.rules||[]).some(r=>r.cats.includes(cat.id)))return true;
    if((p.choice||[]).some(s=>selCats(w,s).includes(cat.id)))return true;
    const q=p.rotating&&p.rotating.schedule[QK];if(q&&q.cats.includes(cat.id))return true;
    return p.auto&&w.autoFocus===cat.id;
  });
}
const visibleCats=()=>CATS.filter(c=>!c.niche||directHit(c));

/* ══════════════════════════════════════════════════════════
   7. TASKS (quarterly activation & picks)
   ══════════════════════════════════════════════════════════ */
function tasksFor(w){
  const p=P(w.product);if(!p)return[];const t=[];
  if(p.rotating){
    const r=p.rotating;
    [QK,NQK].forEach(k=>{
      const q=r.schedule[k];if(!q||w.activated.includes(k))return;
      if(k===NQK&&(!q.opens||q.opens>TODAY))return;
      if(k===QK){
        if(r.retroactive){if(qDeadline(k,r.deadlineDay||31)<NOW)return}
        else if(daysLeftInQ<=2)return;
      }
      const due=r.retroactive?`Activate by ${shortDate(qDeadline(k,r.deadlineDay||31))}`:(k===QK?`Ends ${shortDate(qEnd(k))}`:`Starts ${shortDate(qStart(k))}, activate before you spend`);
      t.push({kind:"activate",q:k,text:`Activate ${qLabel(k)}: ${q.label}`,sub:due});
    });
  }
  const quarterly=(p.choice||[]).filter(s=>s.period==="quarter");
  const stale=quarterly.filter(s=>{const x=w.sel[s.id];return x&&x.opts&&x.opts.length&&(!x.quarter||x.quarter<PICK_Q)});
  if(stale.length){
    const summ=quarterly.map(s=>`${s.rate}% ${selLabels(w,s).join(", ")||"not set"}`).join(" · ");
    t.push({kind:"confirm",text:`Confirm ${qLabel(PICK_Q)} picks`,sub:summ});
  }
  (p.choice||[]).forEach(s=>{if(!selOpts(w,s).length)t.push({kind:"pick",text:`Choose ${s.label.replace("Your ","your ")}`,sub:s.note||""})});
  if(p.auto&&!w.autoFocus)t.push({kind:"pick",text:"Set which category you expect to earn 5%",sub:p.auto.note});
  return t;
}
function allTasks(){return state.wallet.flatMap(w=>tasksFor(w).map(t=>({...t,w})))}

const norm=s=>(s||"").toLowerCase().replace(/[’'.&+-]/g,"").replace(/\s+/g," ").trim();
function searchAll(q){

  const score=(name,aka)=>{const n=norm(name);if(n.startsWith(q))return 3;if(n.split(" ").some(w=>w.startsWith(q)))return 2;if(n.includes(q)||norm(aka).includes(q))return 1;return 0};

  return{st,ct};
}

/* back = {label, fn}: shows a floating back bubble and turns on swipe-back */
let sheetBack=null;
function openSheet(html,keepScroll,back){
  const s=$("sheet"),prev=keepScroll===true?s.querySelector(".sheet")?.scrollTop:(typeof keepScroll==="number"?keepScroll:0);
  sheetBack=back||null;
  s.hidden=false;s.onclick=e=>{if(e.target===s)closeSheet()};
  s.innerHTML=`<div class="sheet ${keepScroll?"still":""}" role="dialog" aria-modal="true"><div class="sheet-top"><div class="handle"></div>${
    back?`<button class="bubble" onclick="sheetGoBack()" aria-label="Back to ${esc(back.label)}">${ic("chevL")}${esc(back.label)}</button>`:""}<button class="bubble close" onclick="closeSheet()" aria-label="Close">${ic("x")}</button></div>${html}</div>`;
  const sh=s.querySelector(".sheet");if(sh){sh.scrollTop=prev||0;sheetGestures(sh)}
  document.body.classList.add("locked");
}
function sheetGoBack(){if(sheetBack)sheetBack.fn()}
/* Swipe down from the top to close; swipe sideways to go back when there is a back step */
function sheetGestures(sh){
  let x0=0,y0=0,sc0=0,mode=null,dx=0,dy=0;
  const reset=()=>{sh.classList.add("settle");sh.style.transform="";sh.style.opacity="";setTimeout(()=>sh.classList.remove("settle"),220)};
  sh.addEventListener("touchstart",e=>{
    if(e.touches.length>1){mode="none";return}
    const t=e.touches[0];x0=t.clientX;y0=t.clientY;sc0=sh.scrollTop;dx=dy=0;
    mode=e.target.closest("input,textarea,select")?"none":null;
  },{passive:true});
  sh.addEventListener("touchmove",e=>{
    if(mode==="none")return;
    const t=e.touches[0];dx=t.clientX-x0;dy=t.clientY-y0;
    if(!mode){
      if(Math.abs(dx)+Math.abs(dy)<10)return;
      if(sheetBack&&Math.abs(dx)>Math.abs(dy)*1.4)mode="h";
      else if(dy>0&&sc0<=0&&sh.scrollTop<=0&&dy>Math.abs(dx))mode="v";
      else{mode="none";return}
    }
    e.preventDefault();
    if(mode==="v")sh.style.transform=`translateY(${Math.max(0,dy)}px)`;
    else{sh.style.transform=`translateX(${dx*.6}px)`;sh.style.opacity=String(Math.max(.5,1-Math.abs(dx)/600))}
  },{passive:false});
  const end=()=>{
    if(mode==="v"){
      if(dy>90){sh.classList.add("settle");sh.style.transform="translateY(100%)";setTimeout(closeSheet,180)}else reset();
    }else if(mode==="h"){
      if(Math.abs(dx)>70)sheetGoBack();else reset();
    }
    mode=null;
  };
  sh.addEventListener("touchend",end);sh.addEventListener("touchcancel",()=>{if(mode)reset();mode=null});
}
function closeSheet(){sheetBack=null;$("sheet").hidden=true;$("sheet").innerHTML="";if($("answer").hidden&&$("onboard").hidden)document.body.classList.remove("locked");render();if(answerCtx)renderAnswer()}

    <h3 class="sec">Rewards</h3>
    <div class="tiers">${tiers.map((t,i)=>`<div class="tier ${i===0?"top":""}"><span class="tier-rate mono">${fmtRate(t.rate)}${unit}</span>
      <span class="row-main"><span class="row-title">${esc(t.t)}</span>${t.s?`<span class="row-sub">${esc(t.s)}</span>`:""}</span></div>`).join("")}</div>
    ${p.type!=="cash"?`<p class="hint">Ranked at ${p.cpp||1}¢ per ${p.type==="miles"?"mile":"point"}.</p>`:""}
    ${notes.length?`<h3 class="sec">Notes & perks</h3><ul class="notes">${notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}
    <h3 class="sec">Card details</h3>
    <label class="flabel" for="f-nick">Nickname</label>
    <input class="field" id="f-nick" value="${esc(w.nickname)}" placeholder="${esc(p.short)}" onchange="setField('${w.id}','nickname',this.value.trim())">
    <label class="flabel" for="f-last4">Last 4 digits</label>
    <input class="field mono" id="f-last4" inputmode="numeric" maxlength="4" value="${esc(w.last4)}" onchange="setField('${w.id}','last4',this.value.replace(/\\D/g,'').slice(0,4))">
    ${SHOW.accountDetails?`<label class="flabel" for="f-due">Due day</label><input class="field" id="f-due" inputmode="numeric" value="${w.dueDay||""}" onchange="setField('${w.id}','dueDay',parseInt(this.value)||null)">`:""}
    ${p.networkOptions?`<div class="flabel">Logo on your card</div><div class="chips">${p.networkOptions.map(n=>`<button class="chip ${netOf(w)===n?"on":""}" onclick="setField('${w.id}','network','${n}')">${capWord(n)}</button>`).join("")}</div>`:""}
    ${state.people.length>1?`<div class="flabel">Whose card</div><div class="chips">${ownerChips(w.owner,`setField('${w.id}','owner','$ID')`)}</div>`:""}
    <p class="source">${s.checked?`Terms checked ${isoToDate(s.checked).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}`:"Terms not yet checked"}${s.url?` · <a href="${esc(s.url)}" target="_blank" rel="noopener">View source</a>`:""}${s.note?`<br>${esc(s.note)}`:""}<br>Always confirm terms with your card issuer.</p>
    <button class="btn-ghost" onclick="closeSheet()">Done</button>
    <button class="btn-danger" onclick="removeCard('${w.id}')">${removeArmed?"Tap again to remove":"Remove from wallet"}</button>
  `,keep);
}
function setupHTML(w){
  const p=P(w.product);let h="";
  if(p.rotating){
    const r=p.rotating;
    h+=[QK,NQK].map(k=>{const q=r.schedule[k];if(!q)return"";const on=w.activated.includes(k);
      const when=k===QK?`Now until ${shortDate(qEnd(k))}`:`Starts ${shortDate(qStart(k))}`;
      const due=r.retroactive?` · activate by ${shortDate(qDeadline(k,r.deadlineDay||31))}`:"";
      return `<div class="row static"><span class="row-main"><span class="row-title">${qLabel(k)}: ${esc(q.label)}</span><span class="row-sub">${when}${due}</span></span>
        <button class="chip ${on?"on":""}" onclick="toggleAct('${w.id}','${k}')">${on?ic("check")+"Activated":"Mark activated"}</button></div>`}).join("");
    h+=`<p class="hint">${esc(r.activateHint||"Activate in your card's app first, then mark it here.")}</p>`;
  }
  (p.choice||[]).forEach(s=>{
    const x=w.sel[s.id]||{},cur=selOpts(w,s);
    const stale=s.period==="quarter"&&x.opts&&x.opts.length&&(!x.quarter||x.quarter<PICK_Q);
    h+=`<div class="flabel">${esc(s.label)} · choose ${s.pick}${s.period==="quarter"?` for ${qLabel(PICK_Q)}`:""}</div>
      <div class="chips">${s.options.map(o=>`<button class="chip ${cur.includes(o.id)?"on":""}" onclick="togglePick('${w.id}','${s.id}','${o.id}')">${esc(o.label)}</button>`).join("")}</div>
      ${stale?`<div class="btn-row"><span class="hint">Last set for ${qLabel(x.quarter||QK)}</span><button class="btn-sm" onclick="confirmSame('${w.id}',true)">Keep same picks</button></div>`:""}
      ${isDefaultSel(w,s)?`<p class="hint">Using the card's default until you choose.</p>`:""}`;
  });
  if(p.auto){
    h+=`<div class="flabel">Where will you spend most this month?</div><p class="hint">Only that category earns 5%.</p>
      <div class="chips">${p.auto.options.map(o=>`<button class="chip ${w.autoFocus===o?"on":""}" onclick="setField('${w.id}','autoFocus','${o}')">${esc(catName(o))}</button>`).join("")}</div>`;
  }
  return h?`<h3 class="sec">${p.rotating?"Quarterly bonus":"Your categories"}</h3>${h}`:"";
}
function ownerChips(sel,action){
  return state.people.map(p=>`<button class="chip ${sel===p.id?"on":""}" onclick="${action.replace("$ID",p.id)}">${esc(p.name)}</button>`).join("");
}
function setField(id,f,v){const w=walletById(id);if(!w)return;w[f]=v;save();openDrawer(id,true)}
function toggleAct(id,k){const w=walletById(id);w.activated=w.activated.includes(k)?w.activated.filter(x=>x!==k):[...w.activated,k];save();
  if(!$("sheet").hidden&&drawerId===id)openDrawer(id,true);else render()}
function togglePick(id,slotId,opt){
  const w=walletById(id),s=P(w.product).choice.find(x=>x.id===slotId);
  const cur=(w.sel[slotId]&&w.sel[slotId].opts)||[];let next;
  if(cur.includes(opt))next=cur.filter(x=>x!==opt);else if(s.pick===1)next=[opt];else next=cur.length>=s.pick?[...cur.slice(1),opt]:[...cur,opt];
  w.sel[slotId]={opts:next,quarter:s.period==="quarter"?PICK_Q:undefined};save();openDrawer(id,true);
}
function confirmSame(id,fromDrawer){const w=walletById(id);
  (P(w.product).choice||[]).forEach(s=>{if(s.period==="quarter"&&w.sel[s.id])w.sel[s.id].quarter=PICK_Q});
  save();if(fromDrawer)openDrawer(id,true);else{render();toast("Picks confirmed")}}
function removeCard(id){
  if(!removeArmed){removeArmed=true;openDrawer(id,true);return}
  const w=walletById(id),idx=state.wallet.indexOf(w);state.wallet.splice(idx,1);save();removeArmed=false;closeSheet();
  toast(`${dn(w)} removed`,()=>{state.wallet.splice(idx,0,w);save();render()});
}

/* ─── Add a card: bank → cards → details ─── */
const POPULAR_BRANDS=["chase","amex","capone","citi","discover","boa","wells","usbank"];
function productsOf(k){return Object.entries(CATALOG.products).filter(([,p])=>p.brand===k).sort((a,b)=>(ownedCount(a[0])>0)-(ownedCount(b[0])>0)||(a[1].status==="closed")-(b[1].status==="closed")||a[1].name.localeCompare(b[1].name))}
const ownedCount=pid=>state.wallet.filter(w=>w.product===pid).length;
let addQ="",addIss=null,bankQ="",draft=null,banksScroll=0,bankCardsScroll=0;
const curScroll=()=>$("sheet").querySelector(".sheet")?.scrollTop||0;
function openAdd(){addQ="";addIss=null;draft=null;renderBanks(false)}
function renderBanks(still=true){
  addIss=null;if(still)still=banksScroll||0.001;
  openSheet(`<h2 class="sheet-title">Add a card</h2><p class="sheet-sub">Choose the bank on your card</p>
    <label class="search">${ic("search")}<input id="add-q" type="search" placeholder="Search banks or cards" value="${esc(addQ)}" autocomplete="off" oninput="addQ=this.value;renderAddBody()"></label>
    <div id="add-body"></div><button class="btn-ghost" onclick="closeSheet()">Cancel</button>`,still);
  renderAddBody();
  if(typeof still==="number")$("sheet").querySelector(".sheet").scrollTop=still;
}
const bankRow=k=>{const n=productsOf(k).length;return `<button class="row" onclick="openBank('${k}')"><span class="row-main"><span class="row-title">${esc(B(k).name)}</span></span><span class="dim">${n} card${n>1?"s":""}</span>${ic("chevR","dim")}</button>`};
function renderAddBody(){
  const q=addQ.trim().toLowerCase();
  const banks=Object.keys(CATALOG.brands).filter(k=>productsOf(k).length).sort((a,b)=>B(a).name.localeCompare(B(b).name));
  if(!q){$("add-body").innerHTML=`<h3 class="sec">Most popular</h3><div class="list">${POPULAR_BRANDS.filter(k=>banks.includes(k)).map(bankRow).join("")}</div>
    <h3 class="sec">All banks A–Z</h3><div class="list">${banks.map(bankRow).join("")}</div>`;return}
  const mb=banks.filter(k=>(B(k).name+" "+B(k).short+" "+(B(k).note||"")).toLowerCase().includes(q));
  const mc=Object.entries(CATALOG.products).filter(([,p])=>(B(p.brand).name+" "+p.name+" "+p.short).toLowerCase().includes(q)).map(([id])=>id);
  $("add-body").innerHTML=(mb.length?`<h3 class="sec">Banks</h3><div class="list">${mb.map(bankRow).join("")}</div>`:"")+
    (mc.length?`<h3 class="sec">Cards</h3><div class="list">${mc.map(cardCompact).join("")}</div>`:"")+
    (!mb.length&&!mc.length?`<p class="hint">No banks or cards match “${esc(addQ)}”.</p>`:"");
}
function cardCompact(id){const p=P(id),owned=ownedCount(id)&&SINGLE_CARD_PER_PRODUCT;
  return `<div class="row static ${owned?"muted":""}">${cardArt(id,56)}<span class="row-main"><span class="row-sub">${esc(B(p.brand).name)}</span><span class="row-title">${esc(p.name)}</span><span class="row-sub">${netLabel(p.network)}</span></span>
    ${owned?`<button class="btn-sm alt" disabled>Already added</button>`:`<button class="btn-sm" onclick="startAdd('${id}')">Add</button>`}</div>`}
function openBank(k){banksScroll=curScroll();addIss=k;bankQ="";bankCardsScroll=0;renderBankCards()}
function renderBankList(){
  const q=bankQ.trim().toLowerCase(),items=productsOf(addIss).filter(([,p])=>!q||(p.name+" "+p.short).toLowerCase().includes(q));
  $("bank-list").innerHTML=items.map(([id])=>cardFull(id)).join("")||`<p class="hint">No ${esc(B(addIss).name)} cards match “${esc(bankQ)}”.</p>`;
}
function renderBankCards(){
  const b=B(addIss),items=productsOf(addIss);
  openSheet(`<h2 class="sheet-title">${esc(b.name)}</h2><p class="sheet-sub">${b.note?esc(b.note):`${items.length} card${items.length>1?"s":""}`}</p>
    ${items.length>3?`<label class="search">${ic("search")}<input type="search" id="bank-q" value="${esc(bankQ)}" placeholder="Search ${esc(b.short||b.name)} cards" autocomplete="off" oninput="bankQ=this.value;renderBankList()"></label>`:""}
    <div id="bank-list" class="offers"></div><button class="btn-ghost" onclick="closeSheet()">Cancel</button>`,bankCardsScroll||0.001,{label:"All banks",fn:()=>renderBanks()});
  renderBankList();$("sheet").querySelector(".sheet").scrollTop=bankCardsScroll||0;
}
function cardFull(id){const p=P(id),owned=ownedCount(id)&&SINGLE_CARD_PER_PRODUCT;
  return `<div class="offer ${owned?"muted":""}"><div class="offer-art">${cardArt(id)}</div>
    <div class="row-title">${esc(B(p.brand).name)} ${esc(p.name)}</div>
    <div class="row-sub">${netLabel(p.network)}${p.business?" · Business":""}${p.status==="closed"?" · No longer offered":""}${owned?" · In your wallet":""}</div>
    ${owned?`<button class="btn" disabled>Already added</button>`:`<button class="btn" onclick="startAdd('${id}')">Add</button>`}</div>`}
function startAdd(pid){if(SINGLE_CARD_PER_PRODUCT&&ownedCount(pid))return;if(addIss)bankCardsScroll=curScroll();else banksScroll=curScroll();const p=P(pid);draft={product:pid,owner:state.people[0]?.id||"",nickname:"",last4:"",network:p.network};renderDraft(false)}
function renderDraft(keep=true){
  const p=P(draft.product);
  openSheet(`<div class="offer-art small">${cardArt(draft.product)}</div>
    <h2 class="sheet-title center">${esc(B(p.brand).name)} ${esc(p.name)}</h2>
    ${state.people.length>1?`<div class="flabel">Whose card is this?</div><div class="chips">${ownerChips(draft.owner,"draft.owner='$ID';renderDraft()")}</div>`:""}
    ${p.networkOptions?`<div class="flabel">Which logo is on your card?</div><div class="chips">${p.networkOptions.map(n=>`<button class="chip ${draft.network===n?"on":""}" onclick="draft.network='${n}';renderDraft()">${capWord(n)}</button>`).join("")}</div>`:""}
    <label class="flabel" for="d-last4">Last 4 digits (optional)</label>
    <input class="field mono" id="d-last4" inputmode="numeric" maxlength="4" placeholder="1234" value="${esc(draft.last4)}" oninput="draft.last4=this.value.replace(/\\D/g,'').slice(0,4)">
    <label class="flabel" for="d-nick">Nickname (optional)</label>
    <input class="field" id="d-nick" placeholder="${esc(p.short)}" value="${esc(draft.nickname)}" oninput="draft.nickname=this.value">
    <p class="hint">Never enter your full card number. The last 4 only help you spot the card at checkout.</p>
    <button class="btn" onclick="addCard()">Add to wallet</button>`,keep,{label:addIss?B(addIss).short||B(addIss).name:"Back",fn:()=>addIss?renderBankCards():renderBanks()});
}
function addCard(){
  const p=P(draft.product);
  const w=normalize({id:"w"+Date.now(),product:draft.product,owner:draft.owner,nickname:draft.nickname.trim(),last4:draft.last4,rewards:"",dueDay:null,limit:""});
  if(p.networkOptions&&draft.network!==p.network)w.network=draft.network;
  state.wallet.push(w);state.onboarded=true;save();draft=null;
  if(p.choice||p.rotating||p.auto)openDrawer(w.id);else{closeSheet();toast(`${dn(w)} added`)}
}

/* ─── First run: which cards do you carry? ─── */
let obSel=new Set(),obQ="";
function openOnboard(){obSel=new Set();obQ="";$("onboard").hidden=false;document.body.classList.add("locked");renderOnboard()}
function renderOnboard(){
  const q=obQ.trim().toLowerCase();
  const ids=q?Object.keys(CATALOG.products).filter(id=>{const p=P(id);return (B(p.brand).name+" "+p.name+" "+p.short).toLowerCase().includes(q)}).slice(0,30):POPULAR_CARDS.filter(P);
  $("ob-grid").innerHTML=ids.map(id=>{const p=P(id),on=obSel.has(id),own=ownedCount(id)>0;
    return `<button class="ob-card ${on?"on":""}" ${own?"disabled":""} onclick="obToggle('${id}')" aria-pressed="${on}">${cardArt(id)}
      <span class="ob-name">${esc(B(p.brand).short)} ${esc(p.name)}</span>${on?`<span class="ob-check">${ic("check")}</span>`:""}${own?`<span class="ob-owned">In wallet</span>`:""}</button>`}).join("")||`<p class="hint">No cards match “${esc(obQ)}”.</p>`;
  const n=obSel.size;
  $("ob-add").disabled=!n;$("ob-add").textContent=n?`Add ${n} card${n>1?"s":""}`:"Tap the cards you carry";
}
function obToggle(id){obSel.has(id)?obSel.delete(id):obSel.add(id);renderOnboard()}
function obSearch(v){obQ=v;renderOnboard()}
function obFinish(skip){
  if(!skip)[...obSel].forEach(id=>state.wallet.push(normalize({id:"w"+Date.now()+Math.random().toString(36).slice(2,6),product:id,owner:state.people[0]?.id||"",nickname:"",last4:"",rewards:"",dueDay:null,limit:""})));
  state.onboarded=true;save();$("onboard").hidden=true;document.body.classList.remove("locked");
  go(!skip&&allTasks().length?"updates":"pay");
  if(!skip&&obSel.size)toast(`${obSel.size} card${obSel.size>1?"s":""} added${allTasks().length?". A few need a quick setup.":""}`);
}

/* ─── Init ─── */
go("pay");
if(!state.wallet.length&&!state.onboarded)openOnboard();
syncCatalog();
if("serviceWorker"in navigator){
  const sw=`const C='card-max-v2';self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll(['./']))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:"application/javascript"}))).catch(()=>{});
}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>
