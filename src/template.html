<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lucro">
<meta name="theme-color" content="#f3f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1412" media="(prefers-color-scheme: dark)">
<title>Lucro</title>
<meta name="description" content="Use the right card, every time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-thumb phone app. Large title on top, content in the middle, tab bar pinned to the bottom. */
:root{
  --bg:#f3f6f2; --surface:#ffffff; --surface-2:#ecf1ea; --ink:#0b1412; --muted:#56655f; --line:#dde5dc;
  --accent:#0f766e; --on-accent:#ffffff; --rate:#047857;
  --primary:#0b1412; --on-primary:#ffffff; --hl:#a3e635; --hl-ink:#0b1412; --badge:#fcd34d; --on-badge:#0b1412; --warn:#8a5200; --star:#d97706; --warn-bg:#fdf1dc; --info:#1d4f91; --info-bg:#e7f0fb;
  --danger:#b42318; --scrim:rgba(8,14,12,.45); --shadow:0 1px 2px rgba(15,26,22,.05),0 10px 30px rgba(15,26,22,.08);
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --tabbar:60px; --gutter:20px;
  --hero-a:rgba(163,230,53,.30); --hero-b:rgba(20,184,166,.26); --hero-c:#eaf3e6; --hero-wave:rgba(255,255,255,.55);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1412; --surface:#131d1a; --surface-2:#1b2723; --ink:#eef3ef; --muted:#9aaba3; --line:#24322d;
  --accent:#2dd4bf; --on-accent:#032420; --rate:#a3e635;
  --primary:#a3e635; --on-primary:#0b1412; --hl:#a3e635; --hl-ink:#0b1412; --badge:#fcd34d; --on-badge:#0b1412; --warn:#fbbf24; --star:#fbbf24; --warn-bg:#2f250f; --info:#9cc7fb; --info-bg:#14243a;
  --danger:#f87171; --hero-a:rgba(163,230,53,.16); --hero-b:rgba(20,184,166,.18); --hero-c:#0e1c18; --hero-wave:rgba(255,255,255,.03); --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1412; --surface:#131d1a; --surface-2:#1b2723; --ink:#eef3ef; --muted:#9aaba3; --line:#24322d;
  --accent:#2dd4bf; --on-accent:#032420; --rate:#a3e635;
  --primary:#a3e635; --on-primary:#0b1412; --hl:#a3e635; --hl-ink:#0b1412; --badge:#fcd34d; --on-badge:#0b1412; --warn:#fbbf24; --star:#fbbf24; --warn-bg:#2f250f; --info:#9cc7fb; --info-bg:#14243a;
  --danger:#f87171; --hero-a:rgba(163,230,53,.16); --hero-b:rgba(20,184,166,.18); --hero-c:#0e1c18; --hero-wave:rgba(255,255,255,.03); --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--surface)}
body{background:var(--bg);min-height:100vh;min-height:100dvh}
html,body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 16px)}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--muted)}
.ic{width:22px;height:22px;flex-shrink:0}
.ic.dim{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* app bar */
.appbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding:calc(env(safe-area-inset-top,0px) + 10px) var(--gutter) 10px;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.appbar h1{font-family:var(--display);font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.btn-pill{display:inline-flex;align-items:center;gap:6px;background:var(--primary);color:var(--on-primary);font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px}
.btn-pill .ic{width:18px;height:18px}
.view{padding:4px var(--gutter) 0}

/* search */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:48px}
.search:focus-within{border-color:var(--accent)}
.search .ic{color:var(--muted)}
.search input{flex:1;min-width:0;border:none;background:transparent;font-size:17px;padding:12px 0;outline:none}
.search input::placeholder{color:var(--muted)}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.clear{color:var(--muted);padding:6px}

/* sections, tiles, chips, lists */
.sec{font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:28px 4px 10px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:92px;justify-content:center;text-align:center}
.tile .ic{width:28px;height:28px;color:var(--accent)}
.tile span{font-size:14px;font-weight:600;line-height:1.2}
.tile:active,.row:active,.chip:active,.card-row:active{background:var(--surface-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500}
.chip .ic{width:16px;height:16px;color:var(--accent)}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip.on .ic{color:var(--on-accent)}
.more{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:16px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-weight:600}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row,.card-row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-top:1px solid var(--line)}
.list>:first-child{border-top:none}
.row-ic{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent);flex-shrink:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--muted)}
.row.muted,.offer.muted{opacity:.6}
.last4{font-size:14px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:8px;vertical-align:middle}
.hint{font-size:13px;color:var(--muted);margin:10px 2px}
.empty{text-align:center;padding:48px 16px;max-width:360px;margin:0 auto}
.empty h2{font-family:var(--display);font-size:22px;margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:20px}
.empty-ic{width:56px;height:56px;border-radius:50%;background:var(--surface-2);color:var(--rate);display:grid;place-items:center;margin:0 auto 14px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:24px 0 8px;line-height:1.6}
.stack{display:flex;flex-direction:column;gap:10px}

/* buttons */
.btn{display:block;width:100%;text-align:center;background:var(--primary);color:var(--on-primary);font-weight:600;font-size:16px;padding:14px;border-radius:14px;margin-top:12px}
.btn:disabled{background:var(--surface-2);color:var(--muted);cursor:default}
.btn-ghost{display:block;width:100%;text-align:center;color:var(--muted);font-weight:600;padding:14px;margin-top:6px}
.btn-danger{display:block;width:100%;text-align:center;color:var(--danger);font-weight:600;padding:12px}
.btn-sm{display:inline-flex;align-items:center;gap:6px;background:var(--primary);color:var(--on-primary);font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;white-space:nowrap}
.btn-sm .ic{width:16px;height:16px}
.btn-sm.alt{background:var(--surface-2);color:var(--ink)}
.btn-sm:disabled{opacity:.7;cursor:default}
.btn-row{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.btn-quiet{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);padding:8px 12px;border-radius:10px;background:var(--surface-2)}
.btn-quiet .ic{width:17px;height:17px}
.link{display:block;margin:10px auto 0;color:var(--accent);font-weight:600;font-size:14px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:600;padding:6px 0}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);display:flex;justify-content:space-around;padding:6px 12px max(6px,calc(env(safe-area-inset-bottom,0px) - 12px))}
/* iPhone fix: paint the bar's color past the bottom edge so no strip of page shows under it */
.tabbar::after,.ob-bar::after{content:"";position:absolute;left:0;right:0;top:100%;height:120px;background:inherit;pointer-events:none}
.tabbar button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;min-height:46px;justify-content:center;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.01em;position:relative}
.tabbar button.on{color:var(--accent)}
.tabbar .ic{width:26px;height:26px}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:var(--bg);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* answer screen */
.ans-bg{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.ans-panel{position:relative;width:100%;max-width:520px;height:calc(100% - env(safe-area-inset-top,0px) - 12px);background:var(--bg);border-radius:22px 22px 0 0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding-top:10px;animation:rise .25s cubic-bezier(.2,.9,.3,1);box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.ans-panel.settle,.sheet.settle{transition:transform .2s ease}
.ans-panel>.handle{margin:0 auto 4px}
.ans-inner{max-width:480px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 32px)}
.ans-bar .star-btn{justify-self:start}
.ans-bar .bubble.close{justify-self:end}
.ans-dollars b{color:var(--ink);font-weight:600}
/* wallet: + button, menu, select mode, deactivated */
.fab{position:fixed;right:18px;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 18px);z-index:35;width:60px;height:60px;border-radius:50%;background:var(--primary);color:var(--hl);display:grid;place-items:center;box-shadow:0 10px 24px rgba(11,20,18,.30),0 2px 6px rgba(0,0,0,.15);animation:popin .2s ease}
.fab .ic{width:28px;height:28px}
.fab:active{transform:scale(.94)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);margin-right:-8px}
.icon-btn:active{background:var(--surface-2)}
.ic.fill circle{fill:currentColor}
.btn-pill.quiet{background:var(--surface-2);color:var(--ink)}
.card-row.inactive{opacity:.55}
.card-row.inactive .art{filter:grayscale(1)}
.card-row.selected{background:var(--surface-2)}
.sel-box{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;color:var(--on-accent)}
.card-row.selected .sel-box{background:var(--primary);border-color:var(--primary)}
.sel-box .ic{width:16px;height:16px}
.more span{display:inline-flex;align-items:center;gap:8px}
.inactive-list{margin-top:4px}
.select-bar{position:fixed;left:12px;right:12px;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 12px);z-index:35;max-width:500px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px 10px 10px 16px;display:flex;align-items:center;gap:8px}
.sel-count{flex:1;font-weight:600;font-size:14px}
.btn-sm.danger,.btn.danger{background:var(--danger);color:var(--bg)}
.btn-sm:disabled{opacity:.45}
#view-wallet{padding-bottom:84px}
.search-row{display:flex;align-items:center;gap:0}
.search-row .search{flex:1;min-width:0}
.search-cancel{color:var(--accent);font-weight:600;font-size:16px;padding:12px 0 12px 12px;display:none}
.search-row.active .search-cancel{display:block}
#add-bottom,.sheet .offers+.btn-outline{margin-top:16px}
/* while a pop-up is open, show messages at the top so they never cover its buttons */
body.locked .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 12px)}
/* wallet list: swipe actions, drag, toolbar */
.swipe-wrap{position:relative;overflow:hidden;background:var(--surface);transition:transform .18s ease}
.swipe-wrap+.swipe-wrap{border-top:1px solid var(--line)}
.swipe-wrap .card-row{position:relative;z-index:1;border-top:none;background:var(--surface);transition:transform .2s ease;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.swipe-wrap .card-row.swiping{transition:none}
.swipe-act{position:absolute;top:0;bottom:0;display:flex}
.swipe-act.left{left:0;width:88px}
.swipe-act.right{right:0;width:176px}
.sw-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:#fff;text-align:center}
.sw-btn .ic{width:22px;height:22px}
.sw-btn.more{background:var(--primary);color:var(--on-primary)}
.sw-btn.archive{background:#64748b}
.sw-btn.restore{background:var(--rate);color:var(--bg)}
.sw-btn.delete{background:var(--danger);color:var(--bg)}
.swipe-wrap.dragging{z-index:5;transition:none;box-shadow:0 14px 30px rgba(0,0,0,.22);border-radius:12px;border-top-color:transparent}
.list.drag-list{overflow:visible}
.list.drag-list .swipe-wrap:not(.dragging){transition:transform .18s ease}
body.no-select{user-select:none;-webkit-user-select:none}
.row-end{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.w-rate{font-size:12px;color:var(--muted);white-space:nowrap}
.w-rate b{color:var(--rate);font-weight:700;font-size:13px}
.pin-ic{display:inline-flex;color:var(--accent);margin-right:4px;vertical-align:-2px}
.pin-ic .ic,.sec .ic{width:14px;height:14px;vertical-align:-2px}
.sec-n{color:var(--muted);font-weight:500;margin-left:4px;letter-spacing:0}
.w-toolbar{display:flex;gap:8px;overflow-x:auto;margin:2px calc(-1*var(--gutter)) 6px;padding:2px var(--gutter) 8px;scrollbar-width:none}
.w-toolbar::-webkit-scrollbar{display:none}
.w-toolbar .chip{flex-shrink:0;white-space:nowrap}
.view-chip .ic{width:16px;height:16px}
.chip.on-soft{border-color:var(--accent);color:var(--accent)}
.empty.small{padding:28px 8px}
.tip{font-size:13px;margin-top:12px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
button.radio{width:100%;text-align:left}
.radio-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center}
.radio.on{border-color:var(--accent)}
.radio.on .radio-dot{border-color:var(--accent)}
.radio.on .radio-dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px;border-top:1px solid var(--line);font-weight:500}
.list>.toggle-row:first-child{border-top:none}
.switch{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .15s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch.on{background:#16a34a}
.switch.on::after{transform:translateX(18px)}
.danger-row .row-title,.danger-row .row-ic{color:var(--danger)}
/* Pay home: favorites panel → recent strip → all categories grid */
.fav-panel{margin-top:18px;padding:14px 12px 12px;border-radius:22px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 14%,var(--surface)) 0%,color-mix(in srgb,var(--star) 10%,var(--surface)) 100%);border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line))}
.fav-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.fav-head h2{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.fav-head h2 .ic{width:20px;height:20px;color:var(--star);fill:currentColor}
.fav-hint{font-size:13px;color:var(--muted);margin:-6px 4px 10px}
.fav-panel .tile{border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)}
.recent-wrap{margin-top:22px}
.recent-head{display:flex;align-items:baseline;justify-content:space-between}
.recent-head .sec{margin:0 2px 10px}
.recent-strip{display:flex;gap:8px;overflow-x:auto;margin:0 calc(-1*var(--gutter));padding:2px var(--gutter) 4px;scrollbar-width:none}
.recent-strip::-webkit-scrollbar{display:none}
.recent-strip .chip{flex-shrink:0;white-space:nowrap;padding:9px 14px 9px 10px}
.recent-strip .chip .ic{width:18px;height:18px;color:var(--accent)}
.all-wrap{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.all-title{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0 2px 4px}
.cat-group{margin-top:14px}
.cat-group h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 2px 10px}
.cat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 6px}
.cat-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px;text-align:center;position:relative}
.cat-bubble{width:56px;height:56px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);transition:transform .1s}
.cat-bubble .ic{width:26px;height:26px}
.cat-btn:active .cat-bubble{transform:scale(.93);background:var(--surface-2)}
.cat-btn span.lbl{font-size:12.5px;font-weight:500;line-height:1.2;color:var(--ink)}
.cat-btn .fav-mark{position:absolute;top:-2px;right:calc(50% - 34px);width:18px;height:18px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--star)}
.cat-btn .fav-mark .ic{width:13px;height:13px;fill:currentColor}
/* card page: rename in the header */
.title-edit{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pencil{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface-2)}
.pencil .ic{width:17px;height:17px}
.pencil:active{background:var(--line)}
.rename-inline{display:flex;align-items:center;gap:6px}
.rename-inline .field{flex:1;min-width:0;font-size:18px;font-weight:600;padding:9px 12px}
.icon-btn.ok{background:var(--primary);color:var(--on-primary);width:40px;height:40px;margin:0}
/* chosen categories: dropdowns, saved summary */
.pick-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 14px 14px;margin-top:4px}
.pick-slot{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pick-slot:last-of-type{border-bottom:none}
.pick-rate{min-width:44px;font-size:20px;font-weight:600;color:var(--rate);line-height:1.2}
.pick-main{flex:1;min-width:0}
.pick-label{font-weight:600;margin-bottom:6px}

.pick-foot{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line);color:var(--rate);font-size:14px;font-weight:600}
.pick-foot .ic{width:18px;height:18px}
.pick-foot span{flex:1}
.pick-new{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px;justify-content:space-between}
.select-wrap{position:relative;display:block;margin-top:8px}
.select{width:100%;appearance:none;-webkit-appearance:none;background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:13px 40px 13px 14px;font-size:16px;font-weight:500;color:var(--ink)}
.select:focus{outline:none;border-color:var(--accent)}
.select-wrap .ic{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.pick-actions{display:flex;gap:10px;margin-top:6px}
.pick-actions .btn{margin:0;flex:1}
.pick-actions .btn-outline{flex:0 0 auto;width:auto;padding:13px 18px}
/* wallet: Sort and Filter pills */
.w-toolbar{flex-wrap:nowrap}
.pill-btn{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;height:38px;padding:0 12px 0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:15px;font-weight:600;color:var(--ink)}
.pill-btn .ic{width:18px;height:18px;color:var(--muted)}
.pill-btn .ic.dim{width:14px;height:14px}
.pill-btn.active{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.pill-btn.active .ic{color:var(--accent)}
.f-chips{margin-top:-2px;align-items:center}
.f-chip{gap:4px;padding:6px 8px 6px 12px;font-size:14px}
.f-chip .ic{width:14px;height:14px}
/* Todoist-style display sheets */
.sheet.custom-top{padding-top:8px}
.sheet.custom-top>.handle{margin:0 auto 6px}
.set-head{position:sticky;top:-8px;z-index:4;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:6px 0 10px;background:var(--bg)}
.set-head h2{text-align:center;font-size:17px;font-weight:700}
.round-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.round-btn .ic{width:20px;height:20px}
.round-btn.ok{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.round-btn.ghost{visibility:hidden}
.set-sec{font-size:15px;font-weight:600;color:var(--muted);margin:18px 4px 8px}
.set-group{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.set-row{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;padding:0 14px;position:relative}
.set-row+.set-row::before{content:"";position:absolute;top:0;left:52px;right:0;border-top:1px solid var(--line)}
.set-row.opt+.set-row.opt::before,.set-row:not(:has(.set-ic))+.set-row::before{left:16px}
.set-row:active{background:var(--surface-2)}
.set-row:disabled{opacity:.45}
.set-ic{width:24px;display:grid;place-items:center;color:var(--muted)}
.set-ic .ic{width:22px;height:22px}
.set-label{flex:1;font-size:17px;font-weight:500}
.set-val{color:var(--muted);font-size:16px;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-row.opt.on .set-label{font-weight:600}
.set-row.opt .ic{color:var(--accent)}
.set-hint{font-size:13px;color:var(--muted);margin:10px 6px 0}
.reset-btn{display:block;width:100%;margin-top:22px;min-height:54px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--danger);font-size:17px;font-weight:600;text-align:center}
/* ⋮ popover menu */
.pop-bg{position:fixed;inset:0;z-index:70;background:transparent}
.pop-menu{position:fixed;min-width:236px;max-width:calc(100vw - 32px);padding:6px;border-radius:16px;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.12);transform-origin:top right;animation:popmenu .16s cubic-bezier(.2,.9,.3,1.2)}
.pop-item{display:flex;align-items:center;gap:14px;width:100%;padding:12px 12px;border-radius:10px;font-size:17px;font-weight:500}

.pop-item:active{background:var(--surface-2)}
.pop-sep{height:1px;background:var(--line);margin:4px 10px}
@keyframes popmenu{from{opacity:0;transform:scale(.85)}}
/* icon-only back bubble */
.bubble.back{padding:0;justify-content:center;width:38px;color:var(--ink)}
/* Pay: big tiles everywhere; favorites marked with a star */
.cat-group .tiles{gap:10px}
.tile .fav-mark{position:absolute;top:8px;right:8px;color:var(--star);display:grid}
.tile .fav-mark .ic{width:15px;height:15px;fill:currentColor;color:var(--star)}
/* ═══ Brand + Pay hero (soft gradient header, greeting, peeking card) ═══ */
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.01em}
.brand-mark{width:34px;height:34px;flex-shrink:0;border-radius:10px;box-shadow:0 4px 12px rgba(15,118,110,.28)}
body.hero-page .appbar{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;transition:background .2s}
body.hero-page.scrolled .appbar{background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--line)}
body.hero-page{position:relative;z-index:0}
body.hero-page::before{content:"";position:absolute;left:0;right:0;top:0;height:420px;z-index:-1;pointer-events:none;
  background:radial-gradient(120% 80% at 0% 0%,var(--hero-a) 0%,transparent 60%),radial-gradient(90% 70% at 100% 10%,var(--hero-b) 0%,transparent 65%),linear-gradient(180deg,var(--hero-c) 0%,var(--bg) 100%)}
body.hero-page::after{content:"";position:absolute;left:-10%;right:-10%;top:250px;height:120px;z-index:-1;pointer-events:none;border-radius:50%;background:var(--hero-wave);filter:blur(2px)}
.pay-hero{position:relative;margin:0 calc(-1*var(--gutter));padding:14px var(--gutter) 6px;min-height:150px;overflow:hidden}
html,body{overflow-x:clip}
.hero-greet{font-family:var(--display);font-size:34px;line-height:1.08;font-weight:700;letter-spacing:-.025em;max-width:68%}
.hero-name{font-size:17px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;margin-top:6px;color:var(--ink)}
.hero-tag{font-size:16px;color:var(--muted);margin-top:8px;max-width:62%}
.hero-meta{margin-top:22px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hero-meta button{color:var(--warn);font:inherit;letter-spacing:inherit;text-transform:inherit}
.hero-peek{position:absolute;right:-46px;top:6px;width:170px;transform:rotate(-6deg);filter:drop-shadow(0 16px 24px rgba(0,0,0,.25));cursor:pointer}
.hero-peek .art{box-shadow:none}
.hero-search{margin-top:18px;box-shadow:0 6px 20px rgba(15,40,35,.08);border-color:transparent}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:30px 2px 12px}

.circle-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);flex-shrink:0}

/* favorites: one white card, tinted tiles inside */
.fav-panel{margin-top:0;padding:12px;border-radius:22px;background:var(--surface);border:none;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(15,40,35,.07)}
.fav-panel .tile{background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:none;box-shadow:none}
.fav-hint{margin:2px 4px 10px}
.recent-wrap{margin-top:0}
.all-wrap{margin-top:0;padding-top:0;border-top:none}
.cat-group:first-of-type{margin-top:0}
/* ═══ Wallet: hero header, summary, premium list ═══ */
.tabbar{justify-content:center;gap:24px}
.tabbar button{max-width:150px}
.appbar-icons{display:flex;align-items:center;gap:6px}
.bell-btn{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:color-mix(in srgb,var(--surface) 70%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.bell-btn .ic{width:24px;height:24px}

.appbar .page-title{font-family:var(--display);font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.025em}
.w-hero{padding:6px var(--gutter) 4px;min-height:170px}
.w-hero .hero-name{margin-top:0}
.w-sub{font-size:16px;color:var(--muted);margin-top:4px}
.w-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:18px 0 6px;padding:16px 6px;border-radius:22px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(15,40,35,.08)}

.w-best{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));font-size:15px}

/* ═══ Notification center ═══ */
.notif-sheet .set-head h2{font-size:20px;font-family:var(--display)}

.alt-main{flex:1;min-width:0;display:flex;flex-direction:column}
.alt-name{font-weight:600}
.alt-sub{font-size:13px;color:var(--muted)}
.alt-rate{font-weight:600;font-size:16px}
.why{display:flex;align-items:center;gap:8px;width:100%;margin-top:20px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-weight:600}
.why .ic:first-child{color:var(--accent)}
.why .ic:last-child{margin-left:auto}
.why-body{padding:12px 4px 0;font-size:15px;display:flex;flex-direction:column;gap:8px}
.why-body .dim{font-size:13px}

/* card art placeholder */
.art{position:relative;display:block;width:100%;aspect-ratio:1.586;max-width:100%;border-radius:14px;overflow:hidden;color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.14)}
.art.mini{display:inline-block;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);flex-shrink:0}
.art-band{position:absolute;inset:0;background:radial-gradient(circle at 85% 18%,rgba(255,255,255,.22),transparent 42%),linear-gradient(120deg,transparent 52%,rgba(255,255,255,.1) 52%,rgba(255,255,255,.1) 70%,transparent 70%)}
.art-iss{position:absolute;top:9%;left:7%;font-family:var(--display);font-weight:700;font-size:16px}
.art-chip{position:absolute;left:7%;top:38%;width:15%;aspect-ratio:1.3;border-radius:18%;background:linear-gradient(135deg,#fde68a,#d4a017 55%,#fcd34d)}
.art.mini .art-chip{top:30%;left:10%;width:26%}
.art-name{position:absolute;left:7%;bottom:9%;right:30%;font-size:15px;font-weight:600;line-height:1.15}
.art-net{position:absolute;right:7%;bottom:9%;font-size:13px;font-weight:700;opacity:.9}


/* favorites */
.sec-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-row .sec{margin-bottom:10px}
.link-btn{color:var(--accent);font-weight:600;font-size:14px;padding:6px 2px}
.tile{position:relative}
.tile .fav-dot{position:absolute;top:8px;right:8px;width:14px;height:14px;color:var(--star)}
.tile .fav-dot .ic{width:14px;height:14px;fill:currentColor}
.star-btn{justify-self:end;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.star-btn.on{color:var(--star)}
.star-btn.on .ic{fill:currentColor}
.fav-row .ic.star{width:24px;height:24px;color:var(--muted)}
.fav-row.on .ic.star{color:var(--star);fill:currentColor}
.fav-count{color:var(--muted);font-size:14px;margin:-6px 0 12px}
/* sheet header: close + floating back bubble */
.sheet{position:relative;overscroll-behavior:contain;touch-action:pan-y;transition:none}
.sheet.dragging{transition:none}
.sheet.settle{transition:transform .2s ease}
.sheet-top{position:sticky;top:0;z-index:5;height:44px;margin:-4px -8px 6px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.sheet-top>*{pointer-events:auto}
.sheet-top .handle{position:absolute;left:50%;top:0;transform:translateX(-50%);margin:0}
.bubble{display:inline-flex;align-items:center;gap:4px;height:38px;min-width:38px;padding:0 12px 0 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.14);font-weight:600;font-size:15px;color:var(--accent)}
.bubble.close{padding:0;justify-content:center;color:var(--ink);margin-left:auto}
.bubble .ic{width:20px;height:20px}
/* opening splash */
#splash{position:fixed;inset:0;z-index:200;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;
  background:#0B1412;
  animation:spOut .55s cubic-bezier(.75,0,.25,1) 1.45s forwards}
#splash.skip{animation:spOut .35s cubic-bezier(.75,0,.25,1) forwards}
.sp-stack{position:relative;width:168px;height:106px;margin-bottom:26px}
.sp-logo{width:116px;height:116px;margin-bottom:18px;border-radius:27px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:popin .45s cubic-bezier(.2,1.3,.4,1) both}
.sp-logo .sp-c1,.sp-logo .sp-c2,.sp-logo .sp-dot{opacity:0;animation:chev .45s cubic-bezier(.2,1.2,.4,1) forwards}
.sp-logo .sp-c1{animation-delay:.25s}.sp-logo .sp-c2{animation-delay:.45s}.sp-logo .sp-dot{animation-delay:.7s}
@keyframes chev{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sp-card{position:absolute;inset:0;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.2);opacity:0;transform:translateY(120px) scale(.8)}
.sp-card i{position:absolute;left:14px;top:38px;width:26px;height:20px;border-radius:5px;background:linear-gradient(135deg,#fde68a,#d4a017 55%,#fcd34d)}
.sp-card.c1{background:linear-gradient(135deg,#fb923c,#c2410c);animation:fanL .6s cubic-bezier(.2,1.3,.4,1) .1s forwards}
.sp-card.c2{background:linear-gradient(135deg,#60a5fa,#1d4ed8);animation:fanR .6s cubic-bezier(.2,1.3,.4,1) .2s forwards}
.sp-card.c3{background:linear-gradient(135deg,#111827,#374151);animation:fanC .6s cubic-bezier(.2,1.3,.4,1) .3s forwards}
.sp-card b{position:absolute;right:-14px;top:-16px;background:#fff;color:#047857;font-family:var(--display);font-weight:700;font-size:20px;padding:6px 11px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.25);transform:scale(0);animation:pop .4s cubic-bezier(.2,1.6,.4,1) .85s forwards}
.sp-word{font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:-.045em;opacity:0;transform:translateY(14px);animation:rise2 .5s ease .5s forwards}
.sp-tag{font-size:17px;font-weight:500;opacity:0;transform:translateY(10px);animation:rise2 .5s ease .7s forwards;color:rgba(255,255,255,.9)}
@keyframes fanL{to{opacity:1;transform:translate(-34px,6px) rotate(-14deg)}}
@keyframes fanR{to{opacity:1;transform:translate(34px,6px) rotate(14deg)}}
@keyframes fanC{to{opacity:1;transform:translateY(-6px)}}
@keyframes pop{to{transform:scale(1)}}
@keyframes rise2{to{opacity:1;transform:none}}
@keyframes drift{to{transform:translate(30px,24px) scale(1.1)}}
@keyframes spOut{to{transform:translateY(-100%);border-radius:0 0 40px 40px}}
@media (prefers-reduced-motion:reduce){
  #splash,#splash *{animation-duration:.01s!important;animation-delay:0s!important}
  #splash{animation:spFade .3s ease .6s forwards!important}
  @keyframes spFade{to{opacity:0}}
}
/* sheets */
.sheet-bg{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .12s ease}
.sheet{background:var(--bg);border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:12px 18px calc(env(safe-area-inset-bottom,0px) + 22px);animation:rise .2s ease}
.sheet.still{animation:none}
.handle{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet-title{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em}
.sheet-title.center,.center{text-align:center}
.sheet-sub{color:var(--muted);margin:4px 0 14px}
.drawer-head{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.drawer-head .sheet-sub{margin:2px 0 6px;font-size:14px}
.tiers{display:flex;flex-direction:column;gap:6px}
.tier{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.tier-rate{min-width:48px;text-align:right;font-weight:600;color:var(--rate)}
.notes{padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.flabel{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:16px 2px 8px}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.field:focus{outline:none;border-color:var(--accent)}
.source{font-size:12px;color:var(--muted);margin-top:20px;line-height:1.6}
.source a{color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;font-size:13px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:11px;color:var(--muted)}
.offers{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.offer{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.offer-art{max-width:260px;margin:0 auto 14px}
.offer-art.small{max-width:200px;margin:8px auto 12px}
.radio-list{display:flex;flex-direction:column;gap:8px}
.radio{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.radio input{accent-color:var(--accent);width:18px;height:18px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}
.task-main{flex:1;min-width:0}
.task-head{display:flex;align-items:center;gap:10px}
.task-text{font-weight:600;margin-top:10px;font-size:15px;line-height:1.35}
.task-head .row-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.task-sub{font-size:13px;color:var(--muted);margin-top:2px}
.task-btns{display:flex;flex-direction:column;gap:8px;flex-shrink:0;width:118px}
.task-btns .btn-sm{justify-content:center;width:100%;text-decoration:none;padding:10px 8px}

/* onboarding */
.onboard{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto;animation:fade .15s ease}
.ob-inner{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 120px}
.ob-inner h1{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.ob-inner>p{color:var(--muted);margin:8px 0 16px}
.ob-grid .art-name{display:none}
.ob-grid .art-iss{font-size:14px}
.ob-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.ob-card{position:relative;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;border:2px solid transparent;background:var(--surface)}
.ob-card.on{border-color:var(--accent)}
.ob-card:disabled{opacity:.5}
.ob-name{font-size:13px;font-weight:600;line-height:1.25}
.ob-check{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.ob-check .ic{width:18px;height:18px}
.ob-owned{font-size:12px;color:var(--muted)}
.ob-bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.ob-bar-in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.ob-bar .btn{margin:0;flex:1}
.ob-bar .btn-ghost{margin:0;width:auto;padding:14px 8px}

/* toast */
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 12px);z-index:60;max-width:480px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:14px;animation:fade .15s ease}
.toast button{color:var(--bg);font-weight:700;text-decoration:underline}

/* ═══ Spacing + press-state audit (Oct 2026) ═══ */
/* name under the greeting: same font as "Good evening", same size as before */
.hero-name{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.01em;text-transform:none;line-height:1.2;margin-top:4px}
.hero-tag{max-width:68%;text-wrap:balance}
.pay-hero{min-height:0}
.hero-meta{margin-top:18px}
/* splash: logo tile gets a soft outline so it reads on the solid background */
.sp-logo{box-shadow:0 0 0 1px rgba(255,255,255,.10),0 20px 50px rgba(0,0,0,.45)}
.sp-tag{color:rgba(255,255,255,.72)}
/* one rhythm for section headings: 28px above, 12px below */
.sec-head{margin:28px 2px 12px}
#view-wallet .sec{margin:28px 4px 12px}
.recent-head .sec{margin:0 2px 12px}
.cat-group{margin-top:20px}
.cat-group h3{margin:0 2px 12px}
.all-title{margin:0 2px 12px}
/* search: results never touch the search box */
#pay-results{margin-top:12px}
#pay-results .sec{margin-top:24px}
/* wallet hero: no dead space between the count and the stats */
.w-hero{min-height:132px;padding-bottom:0}
.w-hero .hero-meta{margin-top:14px}
.w-stats{margin:8px 0 0}
.w-best{margin-top:12px}
#view-wallet .w-toolbar{margin-top:20px}
/* sheets use the same side margin as the pages */
.sheet{padding-left:var(--gutter);padding-right:var(--gutter)}
.ans-inner{padding-left:var(--gutter);padding-right:var(--gutter)}
.sheet-top{margin:-4px -6px 4px}
.sheet-top+.sheet-title,.sheet-top+.drawer-head,.sheet-top+h2{margin-top:2px}
.drawer-head{margin-bottom:14px}
.drawer-head .sheet-sub{margin:2px 0 0}
.sub-last4{display:block;margin-top:2px}
/* answer sheet: favorite star is a bubble, matching the close button */
.ans-bar .star-btn{width:38px;height:38px;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.14)}
.ans-bar .star-btn .ic{width:20px;height:20px}
/* reward tiers: rate column left-aligned, no ragged gap */
.tier-rate{min-width:40px;text-align:left}
/* backup sheet: restore is a real button, not loose text */
.restore-btn{cursor:pointer;margin-top:10px}

/* press states: every tappable thing gives feedback (Apple-style) */
.btn,.btn-sm,.btn-pill,.fab,.round-btn.ok,.dialog-btns .btn{transition:transform .08s ease,filter .08s ease}
.btn:active:not(:disabled),.btn-sm:active:not(:disabled),.btn-pill:active,.round-btn.ok:active{transform:scale(.97);filter:brightness(.9)}
.btn-outline:active,.reset-btn:active,.more:active,.why:active,.w-best:active,.round-btn:active,.bubble:active,.pill-btn:active,.chip:active,.btn-quiet:active,.bell-btn:active,.pencil:active{background:var(--surface-2)}
.btn-ghost:active,.link-btn:active,.link:active,.search-cancel:active,.hero-meta button:active{opacity:.55}
.tile,.fav-panel .tile{transition:transform .08s ease,background .1s}
.tile:active{transform:scale(.97);background:var(--surface-2)}
.fav-panel .tile:active{background:color-mix(in srgb,var(--hl) 34%,var(--surface))}
#view-wallet .swipe-wrap .card-row:active{background:var(--surface-2)}
.alt-row:active,.radio:active,.toggle-row:active,.ob-card:active,.offer:active{background:var(--surface-2)}
.tabbar button:active .ic{transform:scale(.9)}
.tabbar .ic{transition:transform .08s ease}
.star-btn:active,.circle-btn:active{filter:brightness(.92)}
.btn .ic{width:20px;height:20px;vertical-align:-4px;margin-right:6px}

/* ═══ Onboarding: welcome → name → cards → first answer ═══ */
.onboard{display:flex;flex-direction:column}
.ob-inner{flex:1;width:100%;padding:calc(env(safe-area-inset-top,0px) + 12px) var(--gutter) 150px}
.ob-step.fwd{animation:obFwd .22s ease both}
.ob-step.back{animation:obBack .22s ease both}
@keyframes obFwd{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes obBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.ob-top{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:18px}
.ob-top-pad{width:44px}
.ob-dots{display:flex;gap:6px}
.ob-dots span{width:22px;height:5px;border-radius:3px;background:var(--line);transition:background .2s}
.ob-dots span.on{background:var(--ink)}
.ob-inner h1{font-size:32px;text-wrap:balance}
.ob-inner>p,.ob-inner>.ob-step>p{color:var(--muted);margin:8px 0 18px;font-size:16px}
.ob-name-field{font-size:22px;font-weight:600;padding:16px 18px;border-radius:16px;margin-top:8px}
.ob-bar{border-top:none;background:linear-gradient(to top,var(--bg) 70%,transparent);padding-top:24px}
.ob-bar-in{flex-direction:column;align-items:stretch;gap:4px}
.ob-bar-row{display:flex;gap:10px;align-items:center}
.ob-bar-row .btn{flex:1;margin:0}
.ob-bar-row .btn-ghost{width:auto;margin:0;padding:14px 12px;min-width:84px}
.ob-bar .btn:disabled{opacity:.45}
/* welcome: dark brand screen that continues the splash */
.onboard.ob-dark{background:#0B1412;color:#fff}
.ob-dark .ob-inner{padding-top:calc(env(safe-area-inset-top,0px) + 22px)}
.ob-dark .ob-bar{background:linear-gradient(to top,#0B1412 72%,rgba(11,20,18,0))}
.ob-dark .btn{background:#A3E635;color:#0B1412}
.ob-brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.03em}
.ob-brand .brand-mark{width:36px;height:36px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.ob-fan{position:relative;height:150px;margin:26px auto 22px;max-width:300px}
.ob-fan-card{position:absolute;left:50%;top:8px;width:190px;margin-left:-95px;filter:drop-shadow(0 14px 24px rgba(0,0,0,.45))}
.ob-fan-card .art{box-shadow:none}
.ob-fan-card.f0{transform:translate(-58px,18px) rotate(-12deg)}
.ob-fan-card.f1{transform:translate(58px,18px) rotate(12deg)}
.ob-fan-card.f2{transform:translateY(-4px)}
.ob-dark h1{font-size:36px;line-height:1.05;letter-spacing:-.03em;max-width:12ch}
.ob-vals{display:flex;flex-direction:column;gap:16px;margin-top:24px}
.ob-val{display:flex;gap:14px;align-items:flex-start}
.ob-val b{display:block;font-weight:600;font-size:16px}
.ob-val>span:last-child>span{display:block;font-size:14px;color:rgba(255,255,255,.66);margin-top:2px}
.ob-val-ic{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;background:rgba(163,230,53,.14);color:#A3E635}
.ob-val-ic .ic{width:21px;height:21px}
.ob-restore{display:block;text-align:center;padding:14px;min-height:44px;font-size:15px;color:rgba(255,255,255,.72);cursor:pointer}
.ob-restore u{color:#fff;text-underline-offset:3px}
/* last step: first answers from their own wallet */
.ob-done-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--hl);color:var(--hl-ink);margin:12px 0 18px;animation:popin .4s cubic-bezier(.2,1.3,.4,1) both}
.ob-done-ic .ic{width:32px;height:32px;stroke-width:2.4}
.ob-picks{border:none;border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(15,40,35,.08)}
.ob-picks .row-title{font-size:17px}
.ob-rate{font-family:var(--display);font-size:24px;font-weight:700;color:var(--rate);letter-spacing:-.02em}
/* Earn, no cards yet */
.pay-empty{padding-top:8px}
.pe-stack{position:relative;width:150px;height:110px;margin:0 auto 22px}
.pe-card{position:absolute;left:50%;top:10px;width:120px;height:76px;margin-left:-60px;border-radius:12px}
.pe-card.c1{background:linear-gradient(135deg,#14B8A6,#0F766E);transform:translate(-22px,10px) rotate(-10deg)}
.pe-card.c2{background:linear-gradient(135deg,#FCD34D,#F59E0B);transform:translate(22px,10px) rotate(10deg)}
.pe-card.c3{background:var(--surface);border:2px dashed color-mix(in srgb,var(--ink) 30%,transparent);display:grid;place-items:center;color:var(--ink);box-shadow:0 10px 24px rgba(0,0,0,.12)}
.pe-card.c3 .ic{width:28px;height:28px}

/* ═══ Profile ═══ */
.avatar-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--hl);color:var(--hl-ink);font-family:var(--display);font-weight:700;font-size:16px;line-height:1}
.avatar .ic{width:18px;height:18px}
.avatar.lg{width:76px;height:76px;font-size:34px;margin:0 auto 12px}
.avatar.lg .ic{width:36px;height:36px}
.avatar-btn:active .avatar{transform:scale(.92)}
.prof-head{text-align:center;margin-bottom:6px}
.prof-head .title-edit{justify-content:center}
.prof-head .rename-inline{max-width:340px;margin:0 auto}
.prof-head .sheet-sub{margin:4px 0 0}
.prof-stats{grid-template-columns:repeat(3,minmax(0,1fr));margin:18px 0 0}
.prof-sec{font-family:var(--display);font-size:18px;font-weight:700;margin:26px 4px 10px}
.prof-pref{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 14px}
.prof-pref .row-title{flex:1}
.seg{display:flex;width:100%;padding:3px;border-radius:12px;background:var(--surface-2)}
.seg button{flex:1;min-height:40px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);text-align:center}
.seg button.on{background:var(--ink);color:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.prof-toggle-l{display:flex;align-items:center;gap:12px;font-weight:600}
.toggle-row{min-height:56px;padding:9px 14px}
.hero-add{display:inline-block;margin-top:6px;padding:6px 0;min-height:44px;font-size:15px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<header class="appbar"><h1 id="title">Pay</h1><div id="appbar-action"></div></header>

<main>
  <section id="view-pay" class="view">
    <div id="pay-hero" class="pay-hero"></div>
    <div id="pay-empty" class="empty pay-empty" hidden>
      <div class="pe-stack" aria-hidden="true"><span class="pe-card c1"></span><span class="pe-card c2"></span><span class="pe-card c3"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></span></div>
      <h2>Add your first card</h2><p>Lucro shows which card wins at every store. Pick the cards you carry to get started.</p>
      <button class="btn" onclick="openOnboard(3)">Pick your cards</button></div>
    <div id="pay-main">
      <label class="search hero-search" for="q"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Where are you shopping?" autocomplete="off" oninput="onPaySearch(this.value)" aria-label="Search stores or categories">
        <button id="q-clear" class="clear" hidden onclick="clearPaySearch()" aria-label="Clear search"><svg class="ic dim" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </label>
      <div id="pay-results" hidden></div>
      <div id="pay-home">
        <div class="sec-head"><h2 id="top-title"></h2><button class="circle-btn" onclick="openFavs()" id="fav-edit" aria-label="Edit favorites"></button></div>
        <section class="fav-panel" aria-labelledby="top-title">
          <p class="fav-hint" id="fav-hint" hidden></p>
          <div id="top" class="tiles"></div>
        </section>
        <div id="recents"></div>
        <div id="all"></div>
      </div>
    </div>
  </section>

  <section id="view-wallet" class="view" hidden>
    <div id="wallet-list"></div>
    <p id="foot" class="foot"></p>
  </section>

  <section id="view-updates" class="view" hidden aria-hidden="true">
  </section>
</main>

<nav class="tabbar" aria-label="Main">
  <button id="tab-pay" onclick="go('pay')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M14.8 9.2c-.5-.9-1.6-1.4-2.8-1.4-1.6 0-2.8.8-2.8 2s1.1 1.7 2.8 2.1 2.9 1 2.9 2.2-1.2 2.1-2.9 2.1c-1.3 0-2.4-.6-2.9-1.5"/><path d="M12 6v1.8M12 16.2V18"/></svg>Earn</button>
  <button id="tab-wallet" onclick="go('wallet')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h12v3"/><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M16 13.5h2"/></svg>Wallet</button>
</nav>

<div id="answer" class="ans-bg" hidden><div id="ans-panel" class="ans-panel" role="dialog" aria-modal="true"><div class="handle"></div><div id="ans-body"></div></div></div>
<button id="fab" class="fab" onclick="openAdd()" aria-label="Add a card" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="select-bar" class="select-bar" hidden></div>
<div id="dialog" class="dialog-bg" hidden></div>
<div id="popover" class="pop-bg" hidden></div>
<div id="sheet" class="sheet-bg" hidden></div>
<!-- First run (welcome → name → cards → first answer), drawn by renderOnboard() in views.js -->
<div id="onboard" class="onboard" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>

<!-- Opening splash: plays once per launch, tap to skip. Turn off in cats.js (SHOW.splash). -->
<div id="splash" aria-hidden="true">
  <svg class="sp-logo" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="#0B1412"></rect><path class="sp-c1" d="M27 76 L50 53 L73 76" stroke="#14B8A6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"></path><path class="sp-c2" d="M27 52 L50 29 L73 52" stroke="#A3E635" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"></path><circle class="sp-dot" cx="50" cy="15" r="5" fill="#FCD34D"></circle></svg>
  <div class="sp-word">lucro</div>
  <div class="sp-tag">Use the right card, every time.</div>
</div>

<script>
/*__SCRIPT__*/
</script>
</body>
</html>
